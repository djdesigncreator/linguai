        const l = new FileReader();
        l.onload = () => ok(String(l.result).split(',')[1]);
        l.onerror = () => f(new Error('erro'));
        l.readAsDataURL(blob);
      });
      const r = await Rede.correr('transcrever', {audio_base64:base64});
      document.getElementById('trTexto').value = r.texto || '';
      dica.textContent = '';
    }catch(e){ dica.textContent = 'Não consegui transcrever.'; }
  },

  async traduzir(botao){
    const texto = document.getElementById('trTexto').value.trim();
    if(!texto) return;
    botao.disabled = true;
    botao.innerHTML = 'A traduzir <span class="pontos"><i></i><i></i><i></i></span>';

    try{
      const r = await Rede.correr('traduzir', {
        texto, de:this.de().n, para:this.para().n
      });
      document.getElementById('trSaida').innerHTML = `
        <div class="cartao" style="margin-top:18px;">
          <div class="mini-rotulo">${this.para().b} ${this.para().n}</div>
          <p style="font-size:16px;line-height:1.55;">${r.traducao || ''}</p>
          <button class="gr-ouvir" id="trOuvir" style="margin-top:12px;">
            <svg viewBox="0 0 24 24" fill="var(--teal)" width="12" height="12"><path d="M8 5v14l11-7z"/></svg>
            Ouvir
          </button>
        </div>`;
      const ou = document.getElementById('trOuvir');
      if(ou) ou.onclick = () => {
        if(!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(r.traducao || '');
        const mapa = {pt:'pt-PT',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',
                      zh:'zh-CN',ja:'ja-JP',ko:'ko-KR',ar:'ar-SA',ru:'ru-RU',hi:'hi-IN',
                      nl:'nl-NL',sv:'sv-SE',tr:'tr-TR'};
        u.lang = mapa[this.para().c] || 'en-US';
        speechSynthesis.speak(u);
      };
    }catch(e){
      document.getElementById('trDica').textContent = 'Não consegui traduzir.';
    }
    botao.disabled = false;
    botao.textContent = 'Traduzir';
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: GRAVAÇÃO
   Repetir a frase, gravar, ouvir, enviar e receber nota.
   ══════════════════════════════════════════════════════════ */
const Gravacao = {
  frase:null, licao:null,
  gravador:null, pedacos:[], blob:null,
  fluxo:null, contexto:null, analisador:null, animacao:null,
  aGravar:false, segundos:0, relogio:null,

  abrir(frase, licao, idx){
    this.frase = frase;
    this.licao = licao;
    this.idx = (typeof idx === 'number') ? idx
             : (licao && licao.frases ? licao.frases.indexOf(frase) : -1);
    this.blob = null; this.segundos = 0;
    Rota.mostrarModulo();
    this.verPronto();
  },

  alvoTxt(){ return this.frase.alvo || this.frase.en || ''; },
  origTxt(){ return this.frase.origem || this.frase.pt || ''; },

  // ── Ecrã inicial ──────────────────────────────────────
  verPronto(){
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="grVoltar">← ${t('voltar')}</button>
      <div class="gr-etiqueta">Repete a frase${this.idx > -1 && this.licao && this.licao.frases
        ? ' · ' + (this.idx + 1) + '/' + this.licao.frases.length : ''}</div>

      <div class="gr-frase">
        <div class="gr-alvo">${this.alvoTxt()}</div>
        <div class="gr-origem">${this.origTxt()}</div>
        ${this.frase.pronuncia ? `<div class="gr-pron">🗣 ${this.frase.pronuncia}</div>` : ''}
        <button class="gr-ouvir" id="grOuvir">
          <svg viewBox="0 0 24 24" fill="var(--teal)" width="12" height="12"><path d="M8 5v14l11-7z"/></svg>
          Ouvir a frase
        </button>
      </div>

      <div class="gr-palco">
        <canvas id="grOnda" class="gr-onda"></canvas>
        <button class="gr-botao" id="grBotao" aria-label="Gravar">
          <svg viewBox="0 0 24 24" fill="#fff" width="26" height="26">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/>
          </svg>
        </button>
        <div class="gr-dica" id="grDica">Toca para gravar</div>
      </div>

      <div id="grRever"></div>`;

    document.getElementById('grVoltar').onclick = () => this.sair();
    document.getElementById('grOuvir').onclick = e => Licoes.falar(this.alvoTxt(), e.currentTarget);
    document.getElementById('grBotao').onclick = () => this.alternar();
  },

  sair(){
    this.parar(true);
    if(this.licao) Licoes.verLicao(); else Rota.ir('praticar');
  },

  // ── Gravar ────────────────────────────────────────────
  async alternar(){
    if(this.aGravar) this.parar();
    else await this.comecar();
  },

  async comecar(){
    const dica = document.getElementById('grDica');
    try{
      this.fluxo = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
      dica.textContent = 'Não consegui aceder ao microfone.';
      dica.classList.add('gr-dica-erro');
      return;
    }

    this.pedacos = [];
    this.gravador = new MediaRecorder(this.fluxo);
    this.gravador.ondataavailable = ev => { if(ev.data.size) this.pedacos.push(ev.data); };
    this.gravador.onstop = () => this.aoParar();
    this.gravador.start();

    this.aGravar = true;
    this.segundos = 0;
    document.getElementById('grBotao').classList.add('a-gravar');
    dica.classList.remove('gr-dica-erro');
    dica.textContent = 'A gravar… 0s';

    this.relogio = setInterval(() => {
      this.segundos++;
      dica.textContent = `A gravar… ${this.segundos}s`;
      if(this.segundos >= 30) this.parar();
    }, 1000);

    this.desenharOnda();
  },

  parar(silencioso){
    if(this.relogio){ clearInterval(this.relogio); this.relogio = null; }
    if(this.animacao){ cancelAnimationFrame(this.animacao); this.animacao = null; }
    if(this.contexto){ this.contexto.close().catch(()=>{}); this.contexto = null; }

    if(this.gravador && this.gravador.state !== 'inactive'){
      if(silencioso) this.gravador.onstop = null;
      this.gravador.stop();
    }
    if(this.fluxo){ this.fluxo.getTracks().forEach(t => t.stop()); this.fluxo = null; }
    this.aGravar = false;

    const b = document.getElementById('grBotao');
    if(b) b.classList.remove('a-gravar');
  },

  aoParar(){
    this.blob = new Blob(this.pedacos, {type:'audio/webm'});
    const dica = document.getElementById('grDica');
    if(dica) dica.textContent = 'Ouve antes de enviares';
    this.verRever();
  },

  // ── Onda enquanto grava ───────────────────────────────
  desenharOnda(){
    const tela = document.getElementById('grOnda');
    if(!tela || !this.fluxo) return;
    const ctx = tela.getContext('2d');
    const L = tela.width = tela.offsetWidth * 2;
    const A = tela.height = tela.offsetHeight * 2;

    this.contexto = new (window.AudioContext || window.webkitAudioContext)();
    const fonte = this.contexto.createMediaStreamSource(this.fluxo);
    this.analisador = this.contexto.createAnalyser();
    this.analisador.fftSize = 256;
    fonte.connect(this.analisador);

    const dados = new Uint8Array(this.analisador.frequencyBinCount);
    const barras = 34;
    const larg = L / barras * 0.55;
    const vao  = L / barras;

    const pinta = () => {
      this.animacao = requestAnimationFrame(pinta);
      this.analisador.getByteFrequencyData(dados);
      ctx.clearRect(0, 0, L, A);
      ctx.fillStyle = '#7CFF00';
      for(let i = 0; i < barras; i++){
        const v = dados[Math.floor(i * dados.length / barras)] / 255;
        const h = Math.max(A * 0.06, v * A * 0.85);
        const y = (A - h) / 2;
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(i * vao + (vao - larg)/2, y, larg, h, larg/2);
        else ctx.rect(i * vao + (vao - larg)/2, y, larg, h);
        ctx.fill();
      }
    };
    pinta();
  },

  // ── Rever antes de enviar ─────────────────────────────
  verRever(){
    const url = URL.createObjectURL(this.blob);
    document.getElementById('grRever').innerHTML = `
      <div class="gr-rever">
        <audio id="grAudio" src="${url}" preload="metadata"></audio>
        <button class="btn btn-calmo" id="grTocar">▶︎ Ouvir a minha voz</button>
        <button class="btn" id="grEnviar" style="margin-top:10px;">Enviar para avaliação</button>
        <button class="gr-refazer" id="grRefazer">Gravar de novo</button>
      </div>`;

    const a = document.getElementById('grAudio');
    const bt = document.getElementById('grTocar');
    bt.onclick = () => {
      if(a.paused){ a.play(); bt.textContent = '❚❚ A ouvir…'; }
      else{ a.pause(); bt.textContent = '▶︎ Ouvir a minha voz'; }
    };
    a.onended = () => { bt.textContent = '▶︎ Ouvir a minha voz'; };

    document.getElementById('grRefazer').onclick = () => {
      this.blob = null;
      document.getElementById('grRever').innerHTML = '';
      document.getElementById('grDica').textContent = 'Toca para gravar';
    };
    document.getElementById('grEnviar').onclick = e => this.enviar(e.currentTarget);
  },

  // ── Enviar e avaliar ──────────────────────────────────
  async enviar(botao){
    botao.disabled = true;
    Espera.abrir('v-modulo', ['A ouvir a tua voz…', 'A comparar com a frase…', 'A preparar a tua nota…']);

    try{
      const base64 = await new Promise((ok, falha) => {
        const l = new FileReader();
        l.onload = () => ok(String(l.result).split(',')[1]);
        l.onerror = () => falha(new Error('não consegui ler o áudio'));
        l.readAsDataURL(this.blob);
      });

      const r = await Rede.correr('avaliar_gravacao', {
        audio_base64:base64,
        frase:this.alvoTxt(),
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });

      this.verNota(Number(r.pontuacao) || 0, r.feedback || '', r.transcricao || '');
    }catch(e){
      botao.disabled = false;
      botao.textContent = 'Enviar para avaliação';
      const d = document.getElementById('grDica');
      d.textContent = 'Não consegui avaliar. Tenta outra vez.';
      d.classList.add('gr-dica-erro');
    }
  },

  verNota(pontuacao, feedback, transcricao){
    const xp = Jogo.premiar('gravacao', {pontuacao});
    Historico.registar({tipo:'gravacao', titulo:this.alvoTxt(), pontuacao:pontuacao});
    const frases = (this.licao && this.licao.frases) || [];
    const temSeguinte = this.idx > -1 && this.idx + 1 < frases.length;
    let emoji = '💪', titulo = 'Vamos treinar mais';
    if(pontuacao >= 90){ emoji = '🌟'; titulo = 'Pronúncia impecável'; }
    else if(pontuacao >= 70){ emoji = '🎉'; titulo = 'Muito bem'; }
    else if(pontuacao >= 50){ emoji = '👍'; titulo = 'Estás quase'; }

    document.getElementById('v-modulo').innerHTML = `
      <div style="text-align:center;padding:20px 6px;">
        <div style="font-size:50px;margin-bottom:10px;">${emoji}</div>
        <h1 style="font-size:22px;margin-bottom:18px;">${titulo}</h1>

        <div class="ex-anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--linha)" stroke-width="11"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--lima)" stroke-width="11"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              stroke-dasharray="314" stroke-dashoffset="${314 - 314*pontuacao/100}"/>
          </svg>
          <div class="ex-anel-n">${pontuacao}</div>
        </div>

        <div class="ex-xp" style="margin-bottom:20px;">+${xp} XP</div>
      </div>

      ${transcricao ? `<div class="gr-ouvido">
        <div class="gr-ouvido-r">O que ouvi</div>
        <div class="gr-ouvido-t">${transcricao}</div>
      </div>` : ''}

      ${feedback ? `<div class="cartao" style="background:#F3EFFB;border-color:#DCD2F2;">
        <p style="font-size:14px;line-height:1.6;">${feedback}</p>
      </div>` : ''}

      ${temSeguinte ? '<button class="btn" id="grSeguinte" style="margin-top:6px;">Frase seguinte →</button>' : ''}
      <button class="btn ${temSeguinte ? 'btn-calmo' : ''}" id="grOutra" style="margin-top:${temSeguinte ? '10' : '6'}px;">Tentar de novo</button>
      <button class="btn btn-calmo" id="grFim" style="margin-top:10px;">Voltar à lição</button>`;

    document.getElementById('grOutra').onclick = () => this.abrir(this.frase, this.licao, this.idx);
    const bs = document.getElementById('grSeguinte');
    if(bs) bs.onclick = () => {
      const i = this.idx + 1;
      if(Licoes.licao === this.licao) Licoes.fraseSel = i;
      this.abrir(frases[i], this.licao, i);
    };
    document.getElementById('grFim').onclick = () => this.sair();
  }
};

/* ══════════════════════════════════════════════════════════
   8. ARRANQUE
   ══════════════════════════════════════════════════════════ */
const Nucleo = {
  pintarPar(){
    document.getElementById('flagDe').textContent   = acharIdioma(Estado.origem, IDIOMAS[0]).b;
    document.getElementById('flagPara').textContent = acharIdioma(Estado.destino, IDIOMAS[1]).b;
  },

  pintarNav(){
    const itens = [
      {v:'inicio', r:'inicio'}, {v:'perfil', r:'perfil'},
      {v:'praticar', r:'praticar'}, {v:'planos', r:'planos'},
      {v:'assistente', r:'assistente'}
    ];
    document.getElementById('navInt').innerHTML = itens.map(i => `
      <button class="nav-btn ${i.v === 'inicio' ? 'on' : ''}" data-vista="${i.v}">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${ICONES[i.v]}</svg>
        <span>${t(i.r)}</span>
      </button>`).join('');

    document.querySelectorAll('.nav-btn').forEach(b => {
      b.onclick = () => Rota.ir(b.dataset.vista);
    });
  },

  // Vai buscar a interface traduzida, aos bocados, e guarda no aparelho
  async carregarTextos(){
    if(Estado.origem === 'pt'){ Estado.textos = {}; return; }

    const chave = 'linguai:textos3:' + Estado.origem;
    let tx = {};
    try{ tx = JSON.parse(localStorage.getItem(chave) || '{}'); }catch(e){ tx = {}; }

    const falta = Object.keys(RESERVA).filter(k => typeof tx[k] !== 'string');
    if(falta.length){
      const lotes = [];
      for(let i = 0; i < falta.length; i += 40) lotes.push(falta.slice(i, i + 40));

      const respostas = await Promise.all(lotes.map(async lote => {
        const base = {};
        lote.forEach(k => { base[k] = RESERVA[k]; });
        try{
          const r = await Rede.correr('textos_interface', {
            idioma: Estado.origem,
            idioma_nome: acharIdioma(Estado.origem, IDIOMAS[0]).n,
            base: JSON.stringify(base)
          });
          let t = r.textos;
          if(typeof t === 'string'){
            let s = t.slice(t.indexOf('{'));
            const f = s.lastIndexOf('}'); if(f > -1) s = s.slice(0, f + 1);
            t = JSON.parse(s);
          }
          return t || {};
        }catch(e){ return {}; }
      }));

      respostas.forEach(r => Object.keys(r || {}).forEach(k => {
        if(!(k in RESERVA) || typeof r[k] !== 'string') return;
        // Se a tradução perdeu uma parte variável ({n}, {x}…), fica o português
        const partes = String(RESERVA[k]).match(/\{[nmxyp]\}/g) || [];
        if(partes.every(p => r[k].indexOf(p) > -1)) tx[k] = r[k];
      }));
      try{ localStorage.setItem(chave, JSON.stringify(tx)); }catch(e){}
    }
    Estado.textos = tx;
  },

  // Textos fixos dos ecrãs, pintados de cada vez que a língua muda
  pintarTextos(){
    const pares = [
      ['txPraticarT','praticar_hoje'], ['txPraticarD','praticar_sub'],
      ['txAsstT','tira_duvidas'],      ['txAsstD','assistente_sub'],
      ['txPlanosT','planos'],
      ['txPwaT','instalar_t'],         ['txPwaD','instalar_d'],
      ['pwaSim','instalar']
    ];
    pares.forEach(([id, chave]) => {
      const el = document.getElementById(id);
      if(el) el.textContent = t(chave);
    });
  },

  async carregarUtilizador(){
    try{
      const r = await Rede.correr('me');
      if(r && r.sessao && !Sessao.verificar(r.sessao)) return;
      if(r && r.nome !== undefined){
        Estado.utilizador = r;
        if(r.lingua_origem_codigo)  Estado.origem  = r.lingua_origem_codigo;
        if(r.lingua_destino_codigo) Estado.destino = r.lingua_destino_codigo;
        if(r.traducoes){
          try{ Estado.textos = typeof r.traducoes === 'string' ? JSON.parse(r.traducoes) : r.traducoes; }catch(e){}
        }
        Estado.guardar();
      }
    }catch(e){
      // Sem sessão: não deixar vestígios de quem usou antes
      Rede.guardarToken('');
      Estado.utilizador = null;
      Estado.textos = {};
      Estado.origem = 'pt';
      Estado.destino = 'en';
      try{
        localStorage.removeItem('linguai:estado');
        localStorage.removeItem('linguai:jogo');
        localStorage.removeItem('linguai:nivel');
        localStorage.removeItem('linguai:convModo');
        Object.keys(localStorage).forEach(k => {
          if(k.indexOf('linguai:textos') === 0) localStorage.removeItem(k);
        });
        // 'linguai:porConfirmar' fica — é o que permite voltar ao ecrã do código
      }catch(err){}
      console.warn('[Lingu.AI] Sem sessão iniciada.');
    }
  },

  async guardarIdiomas(){
    try{
      await Rede.correr('definir_idiomas', {
        origem_codigo: Estado.origem,
        origem_nome:   acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino_codigo:Estado.destino,
        destino_nome:  acharIdioma(Estado.destino, IDIOMAS[1]).n,
        // Mantém o nível que já tinha — senão seria apagado
        nivel: (Estado.utilizador && Estado.utilizador.nivel) || ''
      });
      return true;
    }catch(e){
      console.warn('[Lingu.AI] Idiomas não guardados:', e.message);
      return false;
    }
  },

  async arrancar(){
    Espera.abrir('espArranque', ['A preparar tudo…', 'Só um instante…']);

    // Primeiro confirmar quem é; só depois usar o que está no aparelho
    await this.carregarUtilizador();

    if(!Estado.utilizador){
      let pendente = null;
      try{ pendente = localStorage.getItem('linguai:porConfirmar'); }catch(e){}
      Login.abrir();
      if(pendente) Login.verConfirmar(pendente);
      return;
    }

    Estado.repor();
    Jogo.repor();

    if(Estado.utilizador.confirmado === 'nao'){
      document.body.classList.add('em-login');
      document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
      document.getElementById('v-login').classList.add('on');
      Login.verConfirmar(Estado.utilizador.email || 'o teu email');
      return;
    }

    if(Entrada.precisa()){ Entrada.abrir(); return; }

    Interface.registar();
    await this.carregarTextos();
    this.pintarPar();
    this.pintarNav();
    this.pintarTextos();
    Rota.ir(Estado.vista);
    Interface.vigiar();
    Vigia.comecar();
    Avisos.iniciar();
  }
};

/* ── Instalação no ecrã principal ──────────────────────── */
let convitePWA = null;

window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  convitePWA = ev;
  try{ if(localStorage.getItem('linguai:semPwa') === 'sim') return; }catch(e){}
  setTimeout(() => {
    const b = document.getElementById('pwaBarra');
    if(b) b.classList.add('on');
  }, 12000);
});

document.getElementById('pwaSim').onclick = async () => {
  const b = document.getElementById('pwaBarra');
  b.classList.remove('on');
  if(!convitePWA) return;
  convitePWA.prompt();
  await convitePWA.userChoice;
  convitePWA = null;
};

document.getElementById('pwaNao').onclick = () => {
  document.getElementById('pwaBarra').classList.remove('on');
  try{ localStorage.setItem('linguai:semPwa', 'sim'); }catch(e){}
};

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

document.addEventListener('visibilitychange', () => {
  if(document.hidden || typeof Tradutor === 'undefined' || !Tradutor.vivo) return;
  Tradutor.manterEcraLigado();
  if(Tradutor.rec){ try{ Tradutor.rec.start(); }catch(e){} }
});

document.getElementById('btnPar').onclick = () => Seletor.abrir('origem');
Nucleo.arrancar();
</script>
