};

/* ══════════════════════════════════════════════════════════
   ESPERA — a professora enquanto a IA trabalha
   Nunca deixa o ecrã em branco, e vai dizendo o que se passa.
   ══════════════════════════════════════════════════════════ */
const Espera = {
  relogio:null, passo:0,

  // Desenho da professora: o balão da marca, com olho e boca
  boneca(){
    return `<div class="esp-palco">
      <svg class="esp-prof" viewBox="0 0 120 120" aria-hidden="true">
        <g class="esp-corpo">
          <path class="esp-balao" d="M60 14C32 14 12 32 12 55c0 12 6 22 15 30l-5 21 23-13c5 1 10 2 15 2 28 0 48-18 48-40S88 14 60 14z"/>
          <circle class="esp-olho" cx="44" cy="50" r="6"/>
          <path class="esp-boca" d="M66 58c8 0 14 5 14 11s-6 11-14 11"/>
        </g>
        <g class="esp-ondas">
          <path d="M92 44c7 9 7 23 0 32"/>
          <path d="M101 36c11 14 11 34 0 48"/>
        </g>
      </svg>
      <div class="esp-pontos"><i></i><i></i><i></i></div>
    </div>`;
  },

  // ecrã: elemento onde desenhar · frases: mensagens que se sucedem
  abrir(alvo, frases){
    const el = typeof alvo === 'string' ? document.getElementById(alvo) : alvo;
    if(!el) return;
    const lista = (frases && frases.length) ? frases : ['A preparar'];
    this.passo = 0;
    el.innerHTML = `<div class="esp">
      ${this.boneca()}
      <div class="esp-txt" id="espTxt">${lista[0]}</div>
    </div>`;

    this.parar();
    if(lista.length > 1){
      this.relogio = setInterval(() => {
        this.passo = (this.passo + 1) % lista.length;
        const t = document.getElementById('espTxt');
        if(!t) return this.parar();
        t.style.opacity = '0';
        setTimeout(() => { t.textContent = lista[this.passo]; t.style.opacity = '1'; }, 220);
      }, 2600);
    }
  },

  parar(){ if(this.relogio){ clearInterval(this.relogio); this.relogio = null; } }
};

const Historico = {
  MAX:60,

  lista(){
    try{ return JSON.parse(localStorage.getItem('linguai:historico') || '[]'); }
    catch(e){ return []; }
  },

  registar(item){
    const l = this.lista();
    l.unshift(Object.assign({quando: Date.now()}, item));
    try{ localStorage.setItem('linguai:historico', JSON.stringify(l.slice(0, this.MAX))); }catch(e){}
  },

  // A lição fica guardada inteira: retomar não gasta IA
  guardarLicao(licao, nivel){
    try{
      localStorage.setItem('linguai:licaoAberta', JSON.stringify({
        nivel, quando: Date.now(),
        licao: {tema:licao.tema, explicacao:licao.explicacao, audio:licao.audio, frases:licao.frases}
      }));
    }catch(e){}
  },

  licaoAberta(){
    try{
      const g = JSON.parse(localStorage.getItem('linguai:licaoAberta') || 'null');
      if(!g || !g.licao || !g.licao.frases || !g.licao.frases.length) return null;
      // Ao fim de 7 dias deixa de fazer sentido retomar
      if(Date.now() - (g.quando || 0) > 7 * 864e5) return null;
      return g;
    }catch(e){ return null; }
  },

  fecharLicao(){ try{ localStorage.removeItem('linguai:licaoAberta'); }catch(e){} },

  quando(ms){
    const d = Math.floor((Date.now() - ms) / 864e5);
    if(d <= 0) return 'Hoje';
    if(d === 1) return 'Ontem';
    if(d < 7) return 'Há ' + d + ' dias';
    return new Date(ms).toLocaleDateString();
  },

  ICONES:{licao:'📚', exercicio:'✅', gravacao:'🎤', conversa:'💬', escrita:'✍️', vocabulario:'🖼'},

  ver(){
    Rota.mostrarModulo();

/* ══════════════════════════════════════════════════════════
   MÓDULO: EXERCÍCIOS
   Gerados a partir das frases da própria lição.
   Instantâneos, sem custo, e sempre sobre o que acabou de ver.
   ══════════════════════════════════════════════════════════ */
const Exercicios = {
  lista:[], idx:0, acertos:0, licao:null,

  baralhar(a){
    const c = a.slice();
    for(let i = c.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  },

  // Constrói 8 exercícios variados a partir das frases
  montar(licao){
    this.licao = licao;
    const fr = (licao.frases || []).filter(f => (f.alvo || f.en) && (f.origem || f.pt));
    if(fr.length < 4) return false;

    const alvo   = f => f.alvo   || f.en || '';
    const origem = f => f.origem || f.pt || '';
    const outras = (certa, campo) =>
      this.baralhar(fr.filter(f => f !== certa)).slice(0,3).map(campo);

    const base = this.baralhar(fr).slice(0, 8);
    this.lista = base.map((f, i) => {
      const tipo = i % 3;

      if(tipo === 0){
        // Traduzir: mostra a frase na língua-alvo, escolhe o significado
        const opcoes = this.baralhar([origem(f), ...outras(f, origem)]);
        return {tipo:'traduzir', enunciado:alvo(f), pergunta:'O que significa?',
                opcoes, correta:opcoes.indexOf(origem(f))};
      }

      if(tipo === 1){
        // Dizer: mostra o significado, escolhe a frase certa
        const opcoes = this.baralhar([alvo(f), ...outras(f, alvo)]);
        return {tipo:'dizer', enunciado:origem(f), pergunta:'Como se diz?',
                opcoes, correta:opcoes.indexOf(alvo(f))};
      }

      // Completar: esconde a palavra mais longa da frase
      const palavras = alvo(f).split(' ');
      let alvoIdx = 0;
      palavras.forEach((p, k) => {
        if(p.replace(/[^\p{L}]/gu,'').length > palavras[alvoIdx].replace(/[^\p{L}]/gu,'').length) alvoIdx = k;
      });
      const certa = palavras[alvoIdx].replace(/[.,!?;:]$/,'');
      const buraco = palavras.map((p,k) => k === alvoIdx ? '____' : p).join(' ');

      const bancoPalavras = fr.filter(x => x !== f)
        .flatMap(x => alvo(x).split(' '))
        .map(p => p.replace(/[.,!?;:]$/,''))
        .filter(p => p.replace(/[^\p{L}]/gu,'').length > 2 && p.toLowerCase() !== certa.toLowerCase());

      const distr = this.baralhar([...new Set(bancoPalavras)]).slice(0,3);
      while(distr.length < 3) distr.push('—');
      const opcoes = this.baralhar([certa, ...distr]);

      return {tipo:'completar', enunciado:buraco, pergunta:origem(f),
              opcoes, correta:opcoes.indexOf(certa)};
    });

    this.idx = 0; this.acertos = 0;
    return true;
  },

  abrir(licao){
    if(!this.montar(licao)){
      Jogo.premiar('licao', {tema:licao.tema});
      if(!licao._contada){ licao._contada = true; Estatisticas.registar('licao'); }
      return Licoes.verLicao();
    }
    Rota.mostrarModulo();
    this.ver();
  },

  ver(){
    const e = this.lista[this.idx];
    const total = this.lista.length;
    const etiqueta = {traduzir:'Traduz', dizer:'Como se diz', completar:'Completa'}[e.tipo];

    document.getElementById('v-modulo').innerHTML = `
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:20px;">
        <button class="ex-sair" id="exSair" aria-label="Sair">✕</button>
        <div style="flex:1;height:6px;background:var(--linha);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${this.idx/total*100}%;background:var(--lima);transition:width .3s;"></div>
        </div>
        <span style="font-size:12px;color:var(--texto-suave);font-weight:600;">${this.idx+1}/${total}</span>
      </div>

      <div class="ex-etiqueta">${etiqueta}</div>
      <div class="ex-caixa">
        <div class="ex-enunciado">${e.enunciado}</div>
        <div class="ex-apoio">${e.pergunta}</div>
      </div>

      <div class="escolhas" id="exOpcoes">
        ${e.opcoes.map((o,i) => `<button class="escolha" data-op="${i}">${o}</button>`).join('')}
      </div>
      <div id="exReacao"></div>`;

    document.getElementById('exSair').onclick = () => Licoes.verLicao();
    document.querySelectorAll('#exOpcoes [data-op]').forEach(b => {
      b.onclick = () => this.responder(Number(b.dataset.op), b);
    });
  },

  responder(escolha, botao){
    const e = this.lista[this.idx];
    const certo = escolha === e.correta;
    if(certo) this.acertos++;

    document.querySelectorAll('#exOpcoes [data-op]').forEach(b => {
      b.disabled = true;
      const i = Number(b.dataset.op);
      if(i === e.correta) b.classList.add('op-certa');
      else if(b === botao) b.classList.add('op-errada');
    });

    document.getElementById('exReacao').innerHTML = `
      <div class="ex-reacao ${certo ? 'boa' : 'ma'}">
        <div class="ex-reacao-t">${certo ? 'Certo!' : 'A resposta era:'}</div>
        ${!certo ? `<div class="ex-reacao-d">${e.opcoes[e.correta]}</div>` : ''}
      </div>
      <button class="btn" id="exProx">${this.idx + 1 < this.lista.length ? 'Seguinte' : 'Ver resultado'}</button>`;

    document.getElementById('exProx').onclick = () => {
      this.idx++;
      if(this.idx < this.lista.length) this.ver();
      else this.resultado();
    };
  },

  resultado(){
    const total = this.lista.length;
    const pct = Math.round(this.acertos / total * 100);
    const xp = Jogo.premiar('exercicio', {acertos:this.acertos, total, tema:this.licao.tema});
    if(!this.licao._contada){ this.licao._contada = true; Estatisticas.registar('licao'); }
    Historico.registar({tipo:'exercicio', titulo:this.licao.tema, pontuacao:pct,
                        detalhe:this.acertos + '/' + total});

    let titulo = 'Continua a praticar', emoji = '💪';
    if(pct >= 90){ titulo = 'Impecável!'; emoji = '🏆'; }
    else if(pct >= 70){ titulo = 'Muito bem!'; emoji = '🎉'; }
    else if(pct >= 50){ titulo = 'Estás quase lá'; emoji = '👍'; }

    document.getElementById('v-modulo').innerHTML = `
      <div style="text-align:center;padding:24px 6px;">
        <div style="font-size:52px;margin-bottom:12px;">${emoji}</div>
        <h1 style="font-size:23px;margin-bottom:8px;">${titulo}</h1>
        <p style="color:var(--texto-suave);font-size:14px;">Acertaste ${this.acertos} de ${total}</p>

        <div class="ex-anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--linha)" stroke-width="11"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--lima)" stroke-width="11"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              stroke-dasharray="314" stroke-dashoffset="${314 - 314*pct/100}"/>
          </svg>
          <div class="ex-anel-n">${pct}%</div>
        </div>

        <div class="ex-xp">+${xp} XP</div>
      </div>

      <button class="btn" id="exRepetir" style="margin-bottom:10px;">Repetir os exercícios</button>
      <button class="btn btn-calmo" id="exVoltar">Voltar à lição</button>`;

    setTimeout(() => Avisos.convidar(), 1200);

    document.getElementById('exRepetir').onclick = () => this.abrir(this.licao);
    document.getElementById('exVoltar').onclick = () => Licoes.verLicao();
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: JOGO (XP · sequência · conquistas · meta diária)
   ══════════════════════════════════════════════════════════ */
const XP_POR = {
  licao:20, exercicio_base:10, exercicio_certo:3,
  gravacao:15, conversa:30, escrita:25, vocabulario:12
};

const CONQUISTAS = [
  {id:'primeira',  ic:'🌱', nome:'Primeiro passo',    d:'Concluíste a tua primeira lição',      ver:e => e.licoes >= 1},
  {id:'dez',       ic:'📚', nome:'Dez lições',        d:'Chegaste às 10 lições',                ver:e => e.licoes >= 10},
  {id:'cinquenta', ic:'🎓', nome:'Cinquenta lições',  d:'Meio caminho andado',                  ver:e => e.licoes >= 50},
  {id:'falante',   ic:'🗣', nome:'Primeira conversa', d:'Falaste com a professora',             ver:e => e.conversas >= 1},
  {id:'escritor',  ic:'✍️', nome:'Primeiro texto',    d:'Escreveste e foste corrigido',         ver:e => e.escritas >= 1},
  {id:'semana',    ic:'🔥', nome:'Uma semana',        d:'7 dias seguidos a praticar',           ver:e => e.sequencia >= 7},
  {id:'mes',       ic:'⚡️', nome:'Um mês',            d:'30 dias seguidos — impressionante',    ver:e => e.sequencia >= 30},
  {id:'mil',       ic:'💎', nome:'Mil XP',            d:'Somaste 1000 pontos',                  ver:e => e.xp >= 1000},
  {id:'perfeito',  ic:'🏆', nome:'Sem falhar uma',    d:'100% num conjunto de exercícios',      ver:e => e.perfeitos >= 1}
];

const METAS = [
  {id:'leve',   xp:50,  nome:'Leve',    d:'cerca de 5 minutos'},
  {id:'normal', xp:100, nome:'Normal',  d:'cerca de 10 minutos'},
  {id:'serio',  xp:200, nome:'A sério', d:'cerca de 20 minutos'}
];

const Jogo = {
  e:{xp:0, xpHoje:0, sequencia:0, ultimoDia:'', licoes:0, conversas:0,
     escritas:0, perfeitos:0, meta:'normal', conquistas:[]},

  hoje(){ return new Date().toISOString().slice(0,10); },

  repor(){
    try{
      const g = JSON.parse(localStorage.getItem('linguai:jogo') || '{}');
      Object.assign(this.e, g);
    }catch(err){}
    this.verificarDia();
  },

  guardar(){
    try{ localStorage.setItem('linguai:jogo', JSON.stringify(this.e)); }catch(err){}
    Rede.correr('guardar_jogo', this.e).catch(() => {});
  },

  // Mantém ou parte a sequência, e zera o contador do dia
  verificarDia(){
    const h = this.hoje();
    if(this.e.ultimoDia === h) return;

    if(this.e.ultimoDia){
      const ontem = new Date(Date.now() - 864e5).toISOString().slice(0,10);
      if(this.e.ultimoDia !== ontem) this.e.sequencia = 0;
    }
    this.e.xpHoje = 0;
  },

  metaAtual(){ return METAS.find(m => m.id === this.e.meta) || METAS[1]; },

  premiar(tipo, dados){
    this.verificarDia();
    let xp = 0;

    if(tipo === 'licao'){ xp = XP_POR.licao; this.e.licoes++; }
    else if(tipo === 'exercicio'){
      xp = XP_POR.exercicio_base + dados.acertos * XP_POR.exercicio_certo;
      if(dados.acertos === dados.total) this.e.perfeitos++;
    }
    else if(tipo === 'gravacao')    xp = XP_POR.gravacao;
    else if(tipo === 'conversa'){   xp = XP_POR.conversa; this.e.conversas++; }
    else if(tipo === 'escrita'){    xp = XP_POR.escrita;  this.e.escritas++; }
    else if(tipo === 'vocabulario') xp = XP_POR.vocabulario;

    this.e.xp += xp;
    this.e.xpHoje += xp;

    // Sequência: conta o dia assim que há atividade
    const h = this.hoje();
    if(this.e.ultimoDia !== h){ this.e.sequencia++; this.e.ultimoDia = h; }

    const novas = this.conquistasNovas();
    this.guardar();
    if(novas.length) setTimeout(() => this.mostrarConquista(novas[0]), 700);
    return xp;
  },

  conquistasNovas(){
    const ganhas = [];
    CONQUISTAS.forEach(c => {
      if(this.e.conquistas.includes(c.id)) return;
      if(c.ver(this.e)){ this.e.conquistas.push(c.id); ganhas.push(c); }
    });
    return ganhas;
  },

  mostrarConquista(c){
    const f = document.createElement('div');
    f.className = 'folha-fundo';
    f.innerHTML = `
      <div class="folha" style="text-align:center;padding-top:30px;">
        <div style="font-size:14px;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;">Nova conquista</div>
        <div class="conq-selo">${c.ic}</div>
        <div style="font-family:'Yusei Magic',cursive;font-size:20px;margin-bottom:8px;">${c.nome}</div>
        <p style="font-size:13.5px;color:var(--texto-suave);line-height:1.55;margin-bottom:22px;">${c.d}</p>
        <button class="btn" id="conqOk">Boa!</button>
      </div>`;
    document.body.appendChild(f);
    f.querySelector('#conqOk').onclick = () => f.remove();
    f.onclick = ev => { if(ev.target === f) f.remove(); };
  },

  // Cartão para o ecrã Início
  cartao(){
    const meta = this.metaAtual();
    const pct = Math.min(100, Math.round(this.e.xpHoje / meta.xp * 100));
    const feito = this.e.xpHoje >= meta.xp;

    return `
      <div class="jogo-linha">
        <div class="jogo-selo ${this.e.sequencia > 0 ? 'aceso' : ''}">
          <div class="n">${this.e.sequencia}</div>
          <div class="r">🔥 dias</div>
        </div>
        <div class="jogo-selo">
          <div class="n">${this.e.xp}</div>
          <div class="r">⭐ XP</div>
        </div>
        <div class="jogo-selo">
          <div class="n">${this.e.conquistas.length}</div>
          <div class="r">🏅 conquistas</div>
        </div>
      </div>

`;
  },

  // Ecrã de conquistas, para o Perfil
  painelConquistas(){
    return `<div class="conq-grelha">
      ${CONQUISTAS.map(c => {
        const tem = this.e.conquistas.includes(c.id);
        return `<div class="conq ${tem ? '' : 'conq-off'}" title="${c.d}">
          <div class="conq-ic">${c.ic}</div>
          <div class="conq-n">${c.nome}</div>
        </div>`;
      }).join('')}
    </div>`;
  },

  escolherMeta(){
    const f = document.createElement('div');
    f.className = 'folha-fundo';
    f.innerHTML = `
      <div class="folha">
        <div class="folha-topo">
          <div style="flex:1;">
            <div style="font-family:'Yusei Magic',cursive;font-size:17px;">Meta diária</div>
            <div style="font-size:12.5px;color:var(--texto-suave);margin-top:2px;">Quanto queres praticar por dia?</div>
          </div>
          <button class="folha-x" id="metaX">✕</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${METAS.map(m => `
            <button class="escolha" data-meta="${m.id}" style="${m.id === this.e.meta ? 'border-color:var(--teal);background:rgba(22,184,166,.06);' : ''}">
              <span><span style="display:block;">${m.nome}</span>
              <span style="display:block;font-size:12px;color:var(--texto-suave);font-weight:400;margin-top:2px;">${m.xp} XP · ${m.d}</span></span>
            </button>`).join('')}
        </div>
      </div>`;
    document.body.appendChild(f);
    f.querySelector('#metaX').onclick = () => f.remove();
    f.onclick = ev => { if(ev.target === f) f.remove(); };
    f.querySelectorAll('[data-meta]').forEach(b => {
      b.onclick = () => { this.e.meta = b.dataset.meta; this.guardar(); f.remove(); Rota.ir('inicio'); };
    });
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: LOGIN
   As palavras-passe vão para o Bubble, que trata da sessão.
   ══════════════════════════════════════════════════════════ */
const Login = {
  modo:'entrar',   // 'entrar' | 'criar' | 'esqueci'

  abrir(){
    document.body.classList.add('em-login');
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
    document.getElementById('v-login').classList.add('on');
    this.ver();
  },

  fechar(){
    document.body.classList.remove('em-login');
    document.getElementById('v-login').classList.remove('on');
  },

  ver(){
    const criar = this.modo === 'criar';
    const esqueci = this.modo === 'esqueci';

    document.getElementById('v-login').innerHTML = `
      <div class="lg-topo">
        <svg viewBox="0 0 32 32" fill="none" class="lg-marca">
          <path d="M16 3C9 3 4 7.7 4 13.5c0 3 1.4 5.6 3.7 7.5L6.5 27l5.8-3.2c1.2.3 2.4.4 3.7.4 7 0 12-4.7 12-10.7S23 3 16 3z" stroke="#081B44" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="1.9" fill="#081B44"/>
          <path d="M17 15c1.8 0 3.2 1 3.2 2.4S18.8 20 17 20" stroke="#F51F47" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div class="lg-nome">Lingu<b>.AI</b></div>
        <p class="lg-lema">${esqueci
          ? 'Escreve o teu email e enviamos-te um link.'
          : criar ? 'Cria a tua conta e escolhe as tuas línguas.'
                  : 'Bem-vindo de volta.'}</p>
      </div>

      ${criar ? `
        <label class="rotulo">Nome</label>
        <input id="lgNome" class="campo" type="text" autocomplete="name" placeholder="Como te chamas?">` : ''}

      <label class="rotulo" ${criar ? 'style="margin-top:14px;"' : ''}>Email</label>
      <input id="lgEmail" class="campo" type="email" autocomplete="email"
             inputmode="email" placeholder="o.teu@email.com">

      ${!esqueci ? `
        <label class="rotulo" style="margin-top:14px;">Palavra-passe</label>
        <div class="lg-senha">
          <input id="lgSenha" class="campo" type="password"
                 autocomplete="${criar ? 'new-password' : 'current-password'}"
                 placeholder="${criar ? 'Mínimo 8 caracteres' : 'A tua palavra-passe'}">
          <button class="lg-olho" id="lgOlho" type="button" aria-label="Mostrar">👁</button>
        </div>` : ''}

      <div id="lgErro" class="pg-erro" style="display:none;"></div>

      <button class="btn" id="lgAcao" style="margin-top:20px;">
        ${esqueci ? 'Enviar link' : criar ? 'Criar conta' : 'Entrar'}
      </button>

      ${!esqueci ? `<button class="lg-link" id="lgEsqueci">Esqueci-me da palavra-passe</button>` : ''}

      <div class="lg-fundo">
        ${esqueci
          ? '<span>Lembraste-te?</span> <button class="lg-troca" data-modo="entrar">Entrar</button>'
          : criar
            ? '<span>Já tens conta?</span> <button class="lg-troca" data-modo="entrar">Entrar</button>'
            : '<span>Ainda não tens conta?</span> <button class="lg-troca" data-modo="criar">Criar conta</button>'}
      </div>`;

    const olho = document.getElementById('lgOlho');
    if(olho) olho.onclick = () => {
      const s = document.getElementById('lgSenha');
      s.type = s.type === 'password' ? 'text' : 'password';
      olho.textContent = s.type === 'password' ? '👁' : '🙈';
    };

    const esq = document.getElementById('lgEsqueci');
    if(esq) esq.onclick = () => { this.modo = 'esqueci'; this.ver(); };

    document.querySelectorAll('#v-login [data-modo]').forEach(b => {
      b.onclick = () => { this.modo = b.dataset.modo; this.ver(); };
    });

    document.getElementById('lgAcao').onclick = e => this.agir(e.currentTarget);

    ['lgEmail','lgSenha','lgNome'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.onkeydown = ev => { if(ev.key === 'Enter') document.getElementById('lgAcao').click(); };
    });
  },

  verConfirmar(email){
    document.getElementById('v-login').innerHTML = `
      <div class="lg-topo" style="padding-top:44px;">
        <div style="font-size:48px;margin-bottom:14px;">📬</div>
        <div class="lg-nome" style="font-size:21px;">Escreve o código</div>
        <p class="lg-lema">Enviámos 6 dígitos para<br><b>${email}</b></p>
      </div>

      <div class="cod-caixa" id="codCaixa">
        ${[0,1,2,3,4,5].map(i => `<input class="cod-d" id="cod${i}" type="tel" inputmode="numeric" maxlength="1" autocomplete="${i===0?'one-time-code':'off'}">`).join('')}
      </div>

      <div id="lgConfErro" class="pg-erro" style="display:none;"></div>

      <button class="btn" id="lgVerificar" style="margin-top:20px;">Confirmar</button>
      <button class="lg-link" id="lgReenviar">Não recebi — enviar outro</button>

      <div class="lg-fundo">
        <button class="lg-troca" id="lgOutroEmail">Usar outro email</button>
      </div>`;

    document.getElementById('lgOutroEmail').onclick = () => {
      try{ localStorage.removeItem('linguai:porConfirmar'); }catch(err){}
      this.modo = 'entrar';
      this.ver();
    };

    const casas = [0,1,2,3,4,5].map(i => document.getElementById('cod' + i));

    casas.forEach((casa, i) => {
      casa.oninput = () => {
        casa.value = casa.value.replace(/\D/g, '');
        if(casa.value && i < 5) casas[i+1].focus();
        if(casas.every(x => x.value)) document.getElementById('lgVerificar').click();
      };
      casa.onkeydown = ev => {
        if(ev.key === 'Backspace' && !casa.value && i > 0) casas[i-1].focus();
      };
      // Colar o código de uma vez
      casa.onpaste = ev => {
        ev.preventDefault();
        const texto = (ev.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        texto.split('').forEach((d, k) => { if(casas[k]) casas[k].value = d; });
        if(texto.length === 6) document.getElementById('lgVerificar').click();
        else if(casas[texto.length]) casas[texto.length].focus();
      };
    });
    casas[0].focus();

    document.getElementById('lgVerificar').onclick = async e => {
      const bt = e.currentTarget;
      const erro = document.getElementById('lgConfErro');
      const codigo = casas.map(x => x.value).join('');

      erro.style.display = 'none';
      if(codigo.length !== 6){
        erro.textContent = 'Escreve os 6 dígitos.';
        erro.style.display = 'block';
        return;
      }

      bt.disabled = true;
      bt.innerHTML = 'A confirmar <span class="pontos"><i></i><i></i><i></i></span>';

      try{
        const r = await Rede.correr('confirmar_codigo', {email, codigo});
        if(r && r.ok === 'yes'){
          try{ localStorage.removeItem('linguai:porConfirmar'); }catch(err){}
          this.fechar();
          await Nucleo.carregarUtilizador();
          if(Entrada.precisa()) Entrada.abrir();
          else{ Nucleo.pintarPar(); Nucleo.pintarNav(); Rota.ir('inicio'); }
          return;
        }
        throw new Error('errado');
      }catch(err){
        bt.disabled = false;
        bt.textContent = 'Confirmar';
        erro.textContent = 'Código errado. Confirma os 6 dígitos do email.';
        erro.style.display = 'block';
        casas.forEach(x => { x.value = ''; });
        casas[0].focus();
      }
    };

    document.getElementById('lgReenviar').onclick = async e => {
      const bt = e.currentTarget;
      bt.disabled = true;
      bt.textContent = 'A enviar…';
      try{
        await Rede.correr('reenviar_codigo', {email});
        bt.textContent = 'Enviado ✓ — vê o teu email';
        setTimeout(() => { bt.disabled = false; bt.textContent = 'Não recebi — enviar outro'; }, 30000);
      }catch(err){
        bt.disabled = false;
        bt.textContent = 'Não recebi — enviar outro';
      }
    };
  },

  async agir(botao){
    const erro = document.getElementById('lgErro');
    const falhar = m => {
      erro.textContent = m; erro.style.display = 'block';
      botao.disabled = false;
      botao.textContent = this.modo === 'esqueci' ? 'Enviar link' : this.modo === 'criar' ? 'Criar conta' : 'Entrar';
    };
    erro.style.display = 'none';

    const email = (document.getElementById('lgEmail').value || '').trim().toLowerCase();
    const senhaEl = document.getElementById('lgSenha');
    const senha = senhaEl ? senhaEl.value : '';
    const nomeEl = document.getElementById('lgNome');
    const nome = nomeEl ? nomeEl.value.trim() : '';

    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return falhar('Escreve um email válido.');
    if(this.modo === 'criar' && !nome) return falhar('Escreve o teu nome.');
    if(this.modo !== 'esqueci' && senha.length < 8) return falhar('A palavra-passe tem de ter pelo menos 8 caracteres.');

    botao.disabled = true;
    botao.innerHTML = 'Um momento <span class="pontos"><i></i><i></i><i></i></span>';

    try{
      if(this.modo === 'esqueci'){
        await Rede.correr('recuperar_senha', {email});
        document.getElementById('v-login').innerHTML = `
          <div class="lg-topo" style="padding-top:60px;">
            <div style="font-size:48px;margin-bottom:14px;">📬</div>
            <div class="lg-nome" style="font-size:20px;">Verifica o teu email</div>
            <p class="lg-lema">Se houver conta com <b>${email}</b>, enviámos um link para criares uma nova palavra-passe.</p>
          </div>
          <button class="btn btn-calmo" id="lgVoltar" style="margin-top:22px;">Voltar</button>`;
        document.getElementById('lgVoltar').onclick = () => { this.modo = 'entrar'; this.ver(); };
        return;
      }

      let r;
      if(this.modo === 'criar'){
        r = await Rede.correr('criar_conta', {email, senha, nome});
        // O criar_conta não devolve token — entramos logo a seguir para o obter
        if(!Rede.token()){
          try{ await Rede.correr('entrar', {email, senha}); }catch(err){}
        }
      }else{
        r = await Rede.correr('entrar', {email, senha});
      }

      if(r && r.erro) return falhar(r.erro);

      // Conta criada mas email por confirmar
      if(this.modo === 'criar' || (r && r.confirmado === 'nao')){
        try{ localStorage.setItem('linguai:porConfirmar', email); }catch(err){}
        return this.verConfirmar(email);
      }

      this.fechar();
      await Nucleo.carregarUtilizador();
      if(Entrada.precisa()) Entrada.abrir();
      else{ Nucleo.pintarPar(); Nucleo.pintarNav(); Rota.ir('inicio'); }

    }catch(e){
      falhar(this.modo === 'criar'
        ? 'Não consegui criar a conta. Talvez este email já esteja registado.'
        : 'Email ou palavra-passe errados.');
    }
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: CONVERSAÇÃO
   Dois modos: falar ao vivo com a professora, ou ver um
   diálogo de exemplo gerado na hora.
   ══════════════════════════════════════════════════════════ */
const TEMAS_CONVERSA = [
  {t:'Saudações',            d:'Cumprimentar alguém',        n:'Iniciante'},
  {t:'Apresentações',        d:'Dizer o teu nome',           n:'Iniciante'},
  {t:'No restaurante',       d:'Pedir comida',               n:'Intermédio'},
  {t:'Pedir direções',       d:'Encontrar um sítio',         n:'Intermédio'},
  {t:'Nas compras',          d:'Comprar roupa',              n:'Iniciante'},
  {t:'No aeroporto',         d:'Fazer o check-in',           n:'Intermédio'},
  {t:'Marcar consulta',      d:'Falar com a clínica',        n:'Intermédio'},
  {t:'Falar ao telefone',    d:'Uma chamada simples',        n:'Intermédio'},
  {t:'Convidar um amigo',    d:'Combinar um encontro',       n:'Iniciante'},
  {t:'No trabalho',          d:'Pedir algo a um colega',     n:'Avançado'},
  {t:'No hotel',             d:'Fazer o check-in',           n:'Intermédio'},
  {t:'No supermercado',      d:'Encontrar produtos',         n:'Iniciante'},
  {t:'Numa emergência',      d:'Pedir ajuda depressa',       n:'Avançado'},
  {t:'Falar do tempo',       d:'Conversa de circunstância',  n:'Iniciante'},
  {t:'Numa entrevista',      d:'Falar de ti profissionalmente', n:'Avançado'},
  {t:'Fazer uma reclamação', d:'Resolver um problema',       n:'Avançado'},
  {t:'No banco',             d:'Abrir conta ou levantar',    n:'Avançado'},
  {t:'Numa festa',           d:'Conhecer gente nova',        n:'Intermédio'}
];

const Conversa = {
  modo:'vivo',                 // 'vivo' | 'modelos'
  tema:null, nivel:'Intermédio',
  historico:[], aFalar:false, aPensar:false,
  gravador:null, pedacos:[], fluxo:null,
  dialogos:{}, abertoIdx:-1,

  abrir(){
    Rota.mostrarModulo();
    try{ this.modo = localStorage.getItem('linguai:convModo') || 'vivo'; }catch(e){}
    this.ver();
  },

  guardarModo(){ try{ localStorage.setItem('linguai:convModo', this.modo); }catch(e){} },

  cabeca(){
    return `
      <button class="voltar" id="cvSair">← ${t('voltar')}</button>
      <div class="cv-abas">
        <button class="cv-aba ${this.modo === 'vivo' ? 'on' : ''}" data-modo="vivo">💬 Ao vivo</button>
        <button class="cv-aba ${this.modo === 'modelos' ? 'on' : ''}" data-modo="modelos">📖 Exemplos</button>
      </div>`;
  },

  ligarCabeca(){
    document.getElementById('cvSair').onclick = () => {
      this.pararTudo();
      if(this.tema && this.historico.length) { this.tema = null; this.historico = []; this.ver(); }
      else Rota.ir('praticar');
    };
    document.querySelectorAll('#v-modulo [data-modo]').forEach(b => {
      b.onclick = () => { this.modo = b.dataset.modo; this.guardarModo(); this.ver(); };
    });
  },

  ver(){
    if(this.modo === 'modelos') return this.verModelos();
    if(this.tema) return this.verSala();
    this.verTemas();
  },

  // ── Escolher tema (ao vivo) ───────────────────────────
  verTemas(){
    document.getElementById('v-modulo').innerHTML = this.cabeca() + `
      <h1 style="font-size:22px;margin-bottom:6px;">Sobre o que queres falar?</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:16px;">
        Tu falas, a professora responde por voz.</p>

      <div class="cv-niveis">
        ${['Iniciante','Intermédio','Avançado'].map(n =>
          `<button class="cv-nivel ${this.nivel===n?'on':''}" data-nv="${n}">${n}</button>`).join('')}
      </div>

      <div class="escolhas" style="margin-top:16px;">
        ${TEMAS_CONVERSA.map((x,i) => `
          <button class="escolha" data-tema="${i}">
            <span><span style="display:block;">${x.t}</span>
            <span style="display:block;font-size:12px;color:var(--texto-suave);font-weight:400;margin-top:2px;">${x.d}</span></span>
            <span class="n">${x.n}</span>
          </button>`).join('')}
      </div>`;

    this.ligarCabeca();
    document.querySelectorAll('#v-modulo [data-nv]').forEach(b => {
      b.onclick = () => { this.nivel = b.dataset.nv; this.ver(); };
    });
    document.querySelectorAll('#v-modulo [data-tema]').forEach(b => {
      b.onclick = () => {
        this.tema = TEMAS_CONVERSA[Number(b.dataset.tema)].t;
        this.historico = [];
        this.verSala();
      };
    });
  },

  // ── Sala de conversa ──────────────────────────────────
  verSala(){
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="cvSair">← Escolher outro tema</button>
      <div class="cv-topo">
        <div>
          <div class="cv-tema">${this.tema}</div>
          <div class="cv-sub">${this.nivel} · ${acharIdioma(Estado.destino, IDIOMAS[1]).n}</div>
        </div>
        ${this.historico.length >= 3 ? '<button class="cv-fim" id="cvTerminar">Terminar</button>' : ''}
      </div>

      <div class="cv-fio" id="cvFio"></div>

      <div class="cv-palco">
        <button class="gr-botao" id="cvMic" aria-label="Falar">
          <svg viewBox="0 0 24 24" fill="#fff" width="26" height="26">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/>
          </svg>
        </button>
        <div class="gr-dica" id="cvDica">Toca e fala</div>
      </div>`;

    document.getElementById('cvSair').onclick = () => {
      this.pararTudo(); this.tema = null; this.historico = []; this.ver();
    };
    const bt = document.getElementById('cvTerminar');
    if(bt) bt.onclick = () => this.terminar();
    document.getElementById('cvMic').onclick = () => this.alternarMic();
    this.pintarFio();
  },

  pintarFio(){
    const fio = document.getElementById('cvFio');
    if(!fio) return;

    if(!this.historico.length && !this.aPensar){
      fio.innerHTML = `<div class="cv-vazio">
        Toca no microfone e diz alguma coisa sobre <b>${this.tema.toLowerCase()}</b>.
      </div>`;
      return;
    }

    fio.innerHTML = this.historico.map(h => `
      ${h.eu ? `<div class="asst-linha eu"><div class="asst-bolha">${h.eu}</div></div>` : ''}
      ${h.ela ? `<div class="asst-linha ia">
        <div class="asst-bolha">${h.ela}</div>
        ${h.traducao ? `<div class="cv-trad">${h.traducao}</div>` : ''}
        ${h.audio ? `<button class="asst-ouvir" data-aud="${h.audio}">
          <svg viewBox="0 0 24 24" fill="var(--teal)" width="10" height="10"><path d="M8 5v14l11-7z"/></svg> Ouvir</button>` : ''}
      </div>` : ''}`).join('') +
      (this.aPensar ? '<div class="asst-linha ia"><div class="asst-bolha"><span class="pontos"><i></i><i></i><i></i></span></div></div>' : '');

    fio.querySelectorAll('[data-aud]').forEach(b => {
      b.onclick = () => { const a = new Audio(b.dataset.aud); a.play(); };
    });
    fio.scrollTop = fio.scrollHeight;
  },

  // ── Microfone ─────────────────────────────────────────
  async alternarMic(){
    const bt = document.getElementById('cvMic');
    const dica = document.getElementById('cvDica');

    if(this.aFalar){
      if(this.gravador && this.gravador.state !== 'inactive') this.gravador.stop();
      if(this.fluxo) this.fluxo.getTracks().forEach(t => t.stop());
      this.aFalar = false;
      bt.classList.remove('a-gravar');
      dica.textContent = 'A enviar…';
      return;
    }

    try{ this.fluxo = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ dica.textContent = 'Sem acesso ao microfone.'; dica.classList.add('gr-dica-erro'); return; }

    this.pedacos = [];
    this.gravador = new MediaRecorder(this.fluxo);
    this.gravador.ondataavailable = ev => { if(ev.data.size) this.pedacos.push(ev.data); };
    this.gravador.onstop = () => this.enviarVoz();
    this.gravador.start();
    this.aFalar = true;
    bt.classList.add('a-gravar');
    dica.classList.remove('gr-dica-erro');
    dica.textContent = 'A ouvir… toca para parar';
  },

  pararTudo(){
    if(this.gravador && this.gravador.state !== 'inactive'){ this.gravador.onstop = null; this.gravador.stop(); }
    if(this.fluxo){ this.fluxo.getTracks().forEach(t => t.stop()); this.fluxo = null; }
    this.aFalar = false;
  },

  async enviarVoz(){
    const dica = document.getElementById('cvDica');
    this.aPensar = true;
    this.pintarFio();

    try{
      const blob = new Blob(this.pedacos, {type:'audio/webm'});
      const base64 = await new Promise((ok,f) => {
        const l = new FileReader();
        l.onload = () => ok(String(l.result).split(',')[1]);
        l.onerror = () => f(new Error('erro'));
        l.readAsDataURL(blob);
      });

      const r = await Rede.correr('conversar', {
        audio_base64:base64,
        historico:JSON.stringify(this.historico),
        tema:this.tema, nivel:this.nivel,
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });

      this.aPensar = false;
      const turno = {
        eu:r.transcricao || '…',
        ela:r.resposta || '',
        traducao:r.traducao || '',
        audio:r.audio || ''
      };
      this.historico.push(turno);

      if(dica){ dica.textContent = 'Toca e fala'; }
      this.verSala();

      if(r.audio){
        setTimeout(() => { const a = new Audio(r.audio); a.play().catch(()=>{}); }, 260);
      }else{
        // A voz vem à parte, para não atrasar a resposta
        this.pedirVoz(turno);
      }
      if(r.sugerir_terminar === 'sim' || r.sugerir_terminar === true) this.sugerirFim(r.motivo || '');

    }catch(e){
      this.aPensar = false;
      this.pintarFio();
      if(dica){ dica.textContent = 'Não consegui enviar. Tenta de novo.'; dica.classList.add('gr-dica-erro'); }
    }
  },

  // Pede a voz da professora depois de a resposta já estar no ecrã
  async pedirVoz(turno){
    if(!turno.ela) return;
    try{
      const r = await Rede.correr('gerar_voz', {
        texto:turno.ela,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      if(r && r.audio){
        turno.audio = r.audio;
        if(this.historico.includes(turno)){
          this.pintarFio();
          const a = new Audio(r.audio);
          a.play().catch(()=>{});
        }
      }
    }catch(e){}
  },

  sugerirFim(motivo){
    const fio = document.getElementById('cvFio');
    if(!fio) return;
    fio.insertAdjacentHTML('beforeend',
      `<div class="cv-sugestao">
        <div style="font-weight:600;margin-bottom:4px;">Já falaste bastante</div>
        ${motivo ? `<div style="font-size:12.5px;color:var(--texto-suave);line-height:1.5;">${motivo}</div>` : ''}
        <button class="btn" id="cvFecharJa" style="margin-top:12px;">Ver a minha avaliação</button>
      </div>`);
    fio.scrollTop = fio.scrollHeight;
    document.getElementById('cvFecharJa').onclick = () => this.terminar();
  },

  // ── Avaliação final ───────────────────────────────────
  async terminar(){
    this.pararTudo();
    Espera.abrir('v-modulo', ['A ouvir a tua conversa…', 'A ver o que correu bem…', 'A preparar o teu resultado…']);

    try{
      const r = await Rede.correr('avaliar_conversa_final', {
        historico:JSON.stringify(this.historico),
        tema:this.tema,
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      this.verAvaliacao(Number(r.pontuacao)||0, r.pontos_fortes||'', r.pontos_melhorar||'', r.avaliacao||'');
    }catch(e){
      this.verAvaliacao(0, '', '', 'Não consegui avaliar esta conversa, mas o treino conta na mesma.');
    }
  },

  verAvaliacao(pontuacao, fortes, melhorar, geral){
    const xp = Jogo.premiar('conversa', {pontuacao});
    Estatisticas.registar('conversa');
    Historico.registar({tipo:'conversa', titulo:this.tema, pontuacao:pontuacao || undefined,
                        detalhe:this.historico.length + ' trocas'});
    document.getElementById('v-modulo').innerHTML = `
      <div style="text-align:center;padding:18px 6px;">
        <div style="font-size:48px;margin-bottom:10px;">🗣</div>
        <h1 style="font-size:22px;margin-bottom:6px;">Conversa terminada</h1>
        <p style="color:var(--texto-suave);font-size:13.5px;">${this.tema} · ${this.historico.length} trocas</p>

        ${pontuacao ? `<div class="ex-anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--linha)" stroke-width="11"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--lima)" stroke-width="11"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              stroke-dasharray="314" stroke-dashoffset="${314 - 314*pontuacao/100}"/>
          </svg>
          <div class="ex-anel-n">${pontuacao}</div>
        </div>` : '<div style="height:16px;"></div>'}

        <div class="ex-xp">+${xp} XP</div>
      </div>

      ${fortes ? `<div class="cartao" style="border-color:rgba(22,184,166,.4);background:rgba(22,184,166,.05);">
        <div class="mini-rotulo" style="color:var(--teal);">Pontos fortes</div>
        <p style="font-size:14px;line-height:1.6;">${fortes}</p></div>` : ''}

      ${melhorar ? `<div class="cartao" style="border-color:#F0C88A;background:#FFF7EC;">
        <div class="mini-rotulo" style="color:#B8860B;">A melhorar</div>
        <p style="font-size:14px;line-height:1.6;">${melhorar}</p></div>` : ''}

      ${geral ? `<div class="cartao" style="background:#F3EFFB;border-color:#DCD2F2;">
        <p style="font-size:14px;line-height:1.6;">${geral}</p></div>` : ''}

      <button class="btn" id="cvNova" style="margin-top:8px;">Nova conversa</button>
      <button class="btn btn-calmo" id="cvFim" style="margin-top:10px;">Voltar</button>`;

    document.getElementById('cvNova').onclick = () => {
      this.tema = null; this.historico = []; this.ver();
    };
    document.getElementById('cvFim').onclick = () => Rota.ir('praticar');
  },

  // ── Exemplos prontos ──────────────────────────────────
  verModelos(){
    document.getElementById('v-modulo').innerHTML = this.cabeca() + `
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:16px;line-height:1.55;">
        Diálogos curtos para veres como soa antes de arriscares ao vivo.</p>
      <div id="cvListaModelos">
        ${TEMAS_CONVERSA.map((x,i) => `
          <div class="cv-modelo" data-mod="${i}">
            <div class="cv-modelo-topo">
              <div style="flex:1;min-width:0;">
                <div class="cv-modelo-t">${x.t}</div>
                <div class="cv-modelo-d">${x.d}</div>
                <span class="cv-modelo-n">${x.n}</span>
              </div>
              <span class="vb-seta" style="${this.abertoIdx===i?'transform:rotate(180deg);':''}">⌄</span>
            </div>
            <div class="cv-modelo-corpo" id="cvCorpo${i}">
              ${this.abertoIdx === i ? this.pintarDialogo(i) : ''}
            </div>
          </div>`).join('')}
      </div>`;

    this.ligarCabeca();
    document.querySelectorAll('#v-modulo [data-mod]').forEach(el => {
      el.querySelector('.cv-modelo-topo').onclick = () => this.abrirModelo(Number(el.dataset.mod));
    });
    this.ligarOuvirDialogo();
  },

  pintarDialogo(i){
    const d = this.dialogos[i];
    if(!d) return '<div class="carregar" style="padding:22px 0;">A preparar o diálogo<span class="pontos"><i></i><i></i><i></i></span></div>';
    return d.map(f => `
      <div class="cv-fala ${f.q === 'a' ? 'fa' : 'fb'}">
        <div class="cv-fala-alvo">${f.alvo || ''}
          <button class="cv-fala-ouvir" data-txt="${(f.alvo||'').replace(/"/g,'&quot;')}">
            <svg viewBox="0 0 24 24" fill="currentColor" width="9" height="9"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <div class="cv-fala-orig">${f.origem || ''}</div>
        ${f.pronuncia ? `<div class="cv-fala-pron">🗣 ${f.pronuncia}</div>` : ''}
      </div>`).join('');
  },

  ligarOuvirDialogo(){
    document.querySelectorAll('#v-modulo .cv-fala-ouvir').forEach(b => {
      b.onclick = ev => { ev.stopPropagation(); Licoes.falar(b.dataset.txt, b); };
    });
  },

  async abrirModelo(i){
    if(this.abertoIdx === i){ this.abertoIdx = -1; return this.verModelos(); }
    this.abertoIdx = i;
    this.verModelos();

    if(this.dialogos[i]) return;

    try{
      const r = await Rede.correr('gerar_dialogo', {
        tema:TEMAS_CONVERSA[i].t,
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      let d = r.dialogo;
      if(typeof d === 'string'){
        let s = d.slice(d.indexOf('['));
        const f = s.lastIndexOf(']'); if(f>-1) s = s.slice(0,f+1);
        d = JSON.parse(s);
      }
      this.dialogos[i] = d || [];
      if(this.abertoIdx === i){
        const corpo = document.getElementById('cvCorpo' + i);
        if(corpo){ corpo.innerHTML = this.pintarDialogo(i); this.ligarOuvirDialogo(); }
      }
    }catch(e){
      const corpo = document.getElementById('cvCorpo' + i);
      if(corpo) corpo.innerHTML = '<div class="aviso" style="margin:10px 0 0;">Não consegui preparar este diálogo.</div>';
    }
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: VOCABULÁRIO
   As 154 imagens vivem num ficheiro à parte, carregado
   só quando abres este módulo — não pesa no arranque.
   ══════════════════════════════════════════════════════════ */
const CATEGORIAS = {
  casa:'Casa e divisões', emocoes:'Emoções', natureza:'Natureza',
  transportes:'Transportes', formas:'Formas e objetos', escola:'Escola e escritório',
  profissoes:'Profissões', desporto:'Desporto e lazer', eletronica:'Eletrónica',
  corpo_humano:'Corpo humano'
};

const Vocabulario = {
  banco:null, pool:[], ordem:[], idx:0, acertos:0, TOTAL:10, respondeu:false,

  async abrir(){
    Rota.mostrarModulo();
    if(this.banco) return this.verCategorias();

    Espera.abrir('v-modulo', ['A carregar as palavras…', 'A juntar as imagens…']);
    try{
      const r = await fetch(CFG.vocabulario);
      this.banco = await r.json();
      this.verCategorias();
    }catch(e){
      document.getElementById('v-modulo').innerHTML =
        '<button class="voltar" id="vcSair">← ' + t('voltar') + '</button>' +
        '<div class="aviso">Não consegui carregar o vocabulário. Confirma que o ficheiro está no mesmo sítio da app.</div>';
      document.getElementById('vcSair').onclick = () => Rota.ir('praticar');
    }
  },

  lingua(cod){ return ['pt','en','es','fr','de','it'].includes(cod) ? cod : 'en'; },
  alvo(o){ return o.t[this.lingua(Estado.destino)]; },
  origem(o){ return o.t[this.lingua(Estado.origem)]; },

  verCategorias(){
    const conta = {};
    this.banco.forEach(o => { conta[o.c] = (conta[o.c] || 0) + 1; });

    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="vcSair">← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">Vocabulário</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">Escolhe uma categoria para praticar.</p>
      <div class="escolhas">
        <button class="escolha" data-cat="todas">Todas misturadas<span class="n">${this.banco.length}</span></button>
        ${Object.keys(CATEGORIAS).filter(k => conta[k]).map(k =>
          `<button class="escolha" data-cat="${k}">${CATEGORIAS[k]}<span class="n">${conta[k]}</span></button>`).join('')}
      </div>`;

    document.getElementById('vcSair').onclick = () => Rota.ir('praticar');
    document.querySelectorAll('#v-modulo [data-cat]').forEach(b => {
      b.onclick = () => this.comecar(b.dataset.cat);
    });
  },

  baralhar(a){
    const c = a.slice();
    for(let i = c.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [c[i], c[j]] = [c[j], c[i]];
    }
    return c;
  },

  comecar(cat){
    this.pool = cat === 'todas' ? this.banco : this.banco.filter(o => o.c === cat);
    if(this.pool.length < 4) return;
    this.ordem = this.baralhar(this.pool).slice(0, this.TOTAL);
    this.idx = 0; this.acertos = 0;
    this.ver();
  },

  ver(){
    this.respondeu = false;
    const o = this.ordem[this.idx];
    const certa = this.alvo(o);
    const erradas = this.baralhar(this.pool.filter(x => this.alvo(x) !== certa)).slice(0,3).map(x => this.alvo(x));
    const opcoes = this.baralhar([certa, ...erradas]);

    document.getElementById('v-modulo').innerHTML = `
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:18px;">
        <button class="ex-sair" id="vcSair" aria-label="Sair">✕</button>
        <div style="flex:1;height:6px;background:var(--linha);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${this.idx/this.ordem.length*100}%;background:var(--lima);transition:width .3s;"></div>
        </div>
        <span style="font-size:12px;color:var(--texto-suave);font-weight:600;">${this.idx+1}/${this.ordem.length}</span>
      </div>

      <div class="ex-etiqueta">Que objeto é este?</div>
      <div class="vc-imagem">
        <img src="data:image/jpeg;base64,${o.i}" alt="">
      </div>

      <div class="escolhas" id="vcOpcoes">
        ${opcoes.map((op,i) => `<button class="escolha" data-op="${i}" data-txt="${op.replace(/"/g,'&quot;')}">${op}</button>`).join('')}
      </div>
      <div id="vcReacao"></div>`;

    document.getElementById('vcSair').onclick = () => this.verCategorias();
    document.querySelectorAll('#vcOpcoes [data-op]').forEach(b => {
      b.onclick = () => this.responder(b.dataset.txt, certa, b, o);
    });
  },

  responder(escolha, certa, botao, objeto){
    if(this.respondeu) return;
    this.respondeu = true;
    const acertou = escolha === certa;
    if(acertou) this.acertos++;

    document.querySelectorAll('#vcOpcoes [data-op]').forEach(b => {
      b.disabled = true;
      if(b.dataset.txt === certa) b.classList.add('op-certa');
      else if(b === botao) b.classList.add('op-errada');
    });

    document.getElementById('vcReacao').innerHTML = `
      <div class="ex-reacao ${acertou ? 'boa' : 'ma'}">
        <div class="ex-reacao-t">${acertou ? 'Certo!' : 'Era: ' + certa}</div>
        <div class="ex-reacao-d" style="font-weight:400;font-size:13.5px;color:var(--texto-suave);">${this.origem(objeto)}</div>
      </div>
      <button class="btn btn-calmo" id="vcOuvir" style="margin-bottom:10px;">🔊 Ouvir</button>
      <button class="btn" id="vcProx">${this.idx + 1 < this.ordem.length ? 'Seguinte' : 'Ver resultado'}</button>`;

    document.getElementById('vcOuvir').onclick = e => Licoes.falar(certa, e.currentTarget);
    document.getElementById('vcProx').onclick = () => {
      this.idx++;
      if(this.idx < this.ordem.length) this.ver(); else this.resultado();
    };
  },

  resultado(){
    const pct = Math.round(this.acertos / this.ordem.length * 100);
    const xp = Jogo.premiar('vocabulario', {acertos:this.acertos, total:this.ordem.length});
    let emoji = '💪', titulo = 'Continua a praticar';
    if(pct >= 90){ emoji = '🏆'; titulo = 'Impecável!'; }
    else if(pct >= 70){ emoji = '🎉'; titulo = 'Muito bem!'; }
    else if(pct >= 50){ emoji = '👍'; titulo = 'Estás quase lá'; }

    document.getElementById('v-modulo').innerHTML = `
      <div style="text-align:center;padding:24px 6px;">
        <div style="font-size:52px;margin-bottom:12px;">${emoji}</div>
        <h1 style="font-size:23px;margin-bottom:8px;">${titulo}</h1>
        <p style="color:var(--texto-suave);font-size:14px;">Acertaste ${this.acertos} de ${this.ordem.length}</p>
        <div class="ex-anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--linha)" stroke-width="11"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--lima)" stroke-width="11"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              stroke-dasharray="314" stroke-dashoffset="${314 - 314*pct/100}"/>
          </svg>
          <div class="ex-anel-n">${pct}%</div>
        </div>
        <div class="ex-xp">+${xp} XP</div>
      </div>
      <button class="btn" id="vcOutra" style="margin-bottom:10px;">Outra ronda</button>
      <button class="btn btn-calmo" id="vcCats">Trocar de categoria</button>`;

    document.getElementById('vcOutra').onclick = () => {
      this.ordem = this.baralhar(this.pool).slice(0, this.TOTAL);
      this.idx = 0; this.acertos = 0; this.ver();
    };
    document.getElementById('vcCats').onclick = () => this.verCategorias();
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: ESCRITA
   ══════════════════════════════════════════════════════════ */
const TEMAS_ESCRITA = [
  'Descreve o teu dia de ontem, do pequeno-almoço até à noite.',
  'Fala sobre um lugar que gostavas de visitar e porquê.',
  'Conta o que fazes num fim de semana perfeito.',
  'Descreve alguém importante na tua vida.',
  'O que mudarias na tua cidade, se pudesses?',
  'Conta uma memória de infância de que te lembres bem.'
];

const Escrita = {
  nivel:null, tema:'',

  abrir(){
    Rota.mostrarModulo();
    try{ this.nivel = localStorage.getItem('linguai:nivel'); }catch(e){}
    if(this.nivel) this.verEscrever(); else this.verNiveis();
  },

  verNiveis(){
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="esSair">← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">${t('qual_nivel')}</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">Para corrigirmos ao teu nível.</p>
      <div class="escolhas">
        ${[['Iniciante','iniciante'],['Intermédio','intermedio'],['Avançado','avancado']]
          .map(([v,k]) => `<button class="escolha" data-n="${v}">${t(k)}<span style="color:var(--indigo-40)">→</span></button>`).join('')}
      </div>`;
    document.getElementById('esSair').onclick = () => Rota.ir('praticar');
    document.querySelectorAll('#v-modulo [data-n]').forEach(b => {
      b.onclick = () => {
        this.nivel = b.dataset.n;
        try{ localStorage.setItem('linguai:nivel', this.nivel); }catch(e){}
        this.verEscrever();
      };
    });
  },

  verEscrever(){
    if(!this.tema) this.tema = TEMAS_ESCRITA[Math.floor(Math.random()*TEMAS_ESCRITA.length)];
    const dest = acharIdioma(Estado.destino, IDIOMAS[1]);

    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="esNivel">← ${t('qual_nivel')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">Escreve em ${dest.n}</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:18px;">${this.nivel} · a professora corrige e explica.</p>

      <div class="cartao" style="background:#F3EFFB;border-color:#DCD2F2;">
        <div class="mini-rotulo">Sugestão de tema</div>
        <p style="font-size:14.5px;line-height:1.55;">${this.tema}</p>
        <button class="gr-ouvir" id="esTrocarTema" style="margin-top:12px;">↻ Outro tema</button>
      </div>

      <textarea id="esTexto" class="es-area" placeholder="Escreve aqui…"></textarea>
      <div class="es-conta"><span id="esN">0</span> palavras</div>
      <button class="btn" id="esAvaliar">Avaliar a minha escrita</button>`;

    document.getElementById('esNivel').onclick = () => {
      try{ localStorage.removeItem('linguai:nivel'); }catch(e){}
      this.verNiveis();
    };
    document.getElementById('esTrocarTema').onclick = () => {
      let novo = this.tema;
      while(novo === this.tema) novo = TEMAS_ESCRITA[Math.floor(Math.random()*TEMAS_ESCRITA.length)];
      this.tema = novo;
      this.verEscrever();
    };

    const area = document.getElementById('esTexto');
    area.oninput = () => {
      const n = area.value.trim() ? area.value.trim().split(/\s+/).length : 0;
      document.getElementById('esN').textContent = n;
    };
    document.getElementById('esAvaliar').onclick = e => this.avaliar(e.currentTarget);
  },

  async avaliar(botao){
    const texto = document.getElementById('esTexto').value.trim();
    if(!texto) return;
    botao.disabled = true;
    Espera.abrir('v-modulo', ['A ler o que escreveste…', 'A procurar os erros…', 'A preparar as explicações…']);

    try{
      const r = await Rede.correr('avaliar_escrita', {
        texto, nivel:this.nivel,
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      let erros = r.erros;
      if(typeof erros === 'string'){
        try{
          let s = erros.slice(erros.indexOf('['));
          const f = s.lastIndexOf(']'); if(f>-1) s = s.slice(0,f+1);
          erros = JSON.parse(s);
        }catch(e){ erros = []; }
      }
      this.verResultado(Number(r.pontuacao)||0, r.versao_corrigida||'', erros||[], r.feedback||'');
    }catch(e){
      botao.disabled = false;
      botao.textContent = 'Avaliar a minha escrita';
      alert(tp('Não consegui avaliar. Tenta outra vez.'));
    }
  },

  verResultado(pontuacao, corrigida, erros, feedback){
    const xp = Jogo.premiar('escrita', {pontuacao});
    Estatisticas.registar('escrita');
    Historico.registar({tipo:'escrita', titulo:this.tema || 'Escrita', pontuacao:pontuacao});
    document.getElementById('v-modulo').innerHTML = `
      <div style="text-align:center;padding:16px 6px;">
        <div class="ex-anel">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--linha)" stroke-width="11"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--lima)" stroke-width="11"
              stroke-linecap="round" transform="rotate(-90 60 60)"
              stroke-dasharray="314" stroke-dashoffset="${314 - 314*pontuacao/100}"/>
          </svg>
          <div class="ex-anel-n">${pontuacao}</div>
        </div>
        <div class="ex-xp">+${xp} XP</div>
      </div>

      ${corrigida ? `<div class="cartao">
        <div class="mini-rotulo">Versão corrigida</div>
        <p data-conteudo style="font-size:14.5px;line-height:1.6;">${corrigida}</p>
      </div>` : ''}

      ${erros.length ? `<div class="seccao-titulo">Erros a melhorar</div>
        ${erros.map(e => `<div class="es-erro">
          <div class="es-erro-l"><span class="es-x">${e.errado||''}</span> → <span class="es-v">${e.certo||''}</span></div>
          ${e.explicacao ? `<div class="es-erro-p">${e.explicacao}</div>` : ''}
        </div>`).join('')}` : ''}

      ${feedback ? `<div class="cartao" style="background:#F3EFFB;border-color:#DCD2F2;margin-top:14px;">
        <div class="mini-rotulo">Comentário da professora</div>
        <p style="font-size:14px;line-height:1.6;">${feedback}</p>
      </div>` : ''}

      <button class="btn" id="esOutra" style="margin-top:8px;">Escrever outro</button>
      <button class="btn btn-calmo" id="esFim" style="margin-top:10px;">Voltar</button>`;

    document.getElementById('esOutra').onclick = () => { this.tema = ''; this.verEscrever(); };
    document.getElementById('esFim').onclick = () => Rota.ir('praticar');
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: VERBOS
   ══════════════════════════════════════════════════════════ */
const Verbos = {
  nivel:null, lista:[], pagina:0, POR_PAG:5, aberto:-1,

  abrir(){
    Rota.mostrarModulo();
    this.lista = []; this.pagina = 0; this.aberto = -1;
    try{ this.nivel = localStorage.getItem('linguai:nivel'); }catch(e){}
    if(this.nivel) this.carregar(); else this.verNiveis();
  },

  verNiveis(){
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="vbSair">← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">${t('qual_nivel')}</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">Verbos adequados ao teu nível.</p>
      <div class="escolhas">
        ${[['Iniciante','iniciante'],['Intermédio','intermedio'],['Avançado','avancado']]
          .map(([v,k]) => `<button class="escolha" data-n="${v}">${t(k)}<span style="color:var(--indigo-40)">→</span></button>`).join('')}
      </div>`;
    document.getElementById('vbSair').onclick = () => Rota.ir('praticar');
    document.querySelectorAll('#v-modulo [data-n]').forEach(b => {
      b.onclick = () => {
        this.nivel = b.dataset.n;
        try{ localStorage.setItem('linguai:nivel', this.nivel); }catch(e){}
        this.carregar();
      };
    });
  },

  async carregar(mais){
    Espera.abrir('v-modulo', mais
      ? ['A procurar mais verbos…', 'A conjugar…', 'Quase pronto']
      : ['A preparar os verbos…', 'A escolher os mais úteis…', 'A conjugar…']);
    try{
      const r = await Rede.correr('gerar_verbos', {
        nivel:this.nivel,
        existentes:JSON.stringify(this.lista.map(v => v.infinitivo)),
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      let novos = r.verbos;
      if(typeof novos === 'string'){
        let s = novos.slice(novos.indexOf('['));
        const f = s.lastIndexOf(']'); if(f>-1) s = s.slice(0,f+1);
        novos = JSON.parse(s);
      }
      this.lista = this.lista.concat(novos || []);
      if(mais) this.pagina = Math.floor((this.lista.length - 1) / this.POR_PAG);
      this.ver();
    }catch(e){
      document.getElementById('v-modulo').innerHTML = `
        <button class="voltar" id="vbSair">← ${t('voltar')}</button>
        <div class="aviso">Não consegui trazer os verbos. ${e.message}</div>`;
      document.getElementById('vbSair').onclick = () => Rota.ir('praticar');
    }
  },

  ver(){
    const total = Math.max(1, Math.ceil(this.lista.length / this.POR_PAG));
    const ini = this.pagina * this.POR_PAG;
    const lote = this.lista.slice(ini, ini + this.POR_PAG);

    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="vbNivel">← ${t('qual_nivel')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">Conjugação</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:18px;">${this.nivel} · ${this.lista.length} verbos</p>

      ${lote.map((v,i) => this.cartaoVerbo(v, ini+i)).join('')}

      ${total > 1 ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0;">
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-vp="-1" ${this.pagina===0?'disabled':''}>←</button>
        <span style="font-size:12.5px;color:var(--texto-suave);font-weight:600;">${this.pagina+1} / ${total}</span>
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-vp="1" ${this.pagina>=total-1?'disabled':''}>→</button>
      </div>` : ''}

      <button class="btn" id="vbMais" style="margin-top:8px;">Gerar mais verbos</button>`;

    document.getElementById('vbNivel').onclick = () => {
      try{ localStorage.removeItem('linguai:nivel'); }catch(e){}
      this.lista = []; this.verNiveis();
    };
    document.getElementById('vbMais').onclick = () => this.carregar(true);
    document.querySelectorAll('#v-modulo [data-vp]').forEach(b => {
      b.onclick = () => { this.pagina += Number(b.dataset.vp); this.aberto = -1; this.ver(); };
    });
    document.querySelectorAll('#v-modulo [data-vb]').forEach(b => {
      b.onclick = ev => {
        if(ev.target.closest('.vb-ouvir')) return;
        const i = Number(b.dataset.vb);
        this.aberto = this.aberto === i ? -1 : i;
        this.ver();
      };
    });
    document.querySelectorAll('#v-modulo .vb-ouvir').forEach(b => {
      b.onclick = () => Licoes.falar(b.dataset.txt, b);
    });
  },

  cartaoVerbo(v, idx){
    const aberto = this.aberto === idx;
    const tempos = v.tempos || [];
    return `
      <div class="cartao vb-cartao" data-vb="${idx}" style="${aberto?'border-color:var(--teal);':''}">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div class="vb-inf">${v.infinitivo||''}</div>
            <div class="vb-sig">${v.significado||''}</div>
            ${v.pronuncia_infinitivo ? `<div class="vb-pron">🗣 ${v.pronuncia_infinitivo}</div>` : ''}
          </div>
          <span class="vb-seta" style="${aberto?'transform:rotate(180deg);':''}">⌄</span>
        </div>
        ${aberto && tempos.length ? `<div class="vb-tempos">
          ${tempos.map(tp => `<div class="vb-tempo">
            <div class="vb-tempo-n">${tp.nome||''}</div>
            <div class="vb-forma">${tp.forma||''}</div>
            ${tp.frase_alvo ? `<div class="vb-frase">
              <div style="flex:1;min-width:0;">
                <div class="vb-fa">${tp.frase_alvo}</div>
                <div class="vb-fo">${tp.frase_origem||''}</div>
              </div>
              <button class="vb-ouvir" data-txt="${(tp.frase_alvo||'').replace(/"/g,'&quot;')}">
                <svg viewBox="0 0 24 24" fill="var(--teal)" width="10" height="10"><path d="M8 5v14l11-7z"/></svg>
              </button></div>` : ''}
          </div>`).join('')}
        </div>` : ''}
      </div>`;
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: TRADUTOR
   ══════════════════════════════════════════════════════════ */
const Tradutor = {
  invertido:false, gravador:null, pedacos:[], fluxo:null, aGravar:false,

  abrir(){ Rota.mostrarModulo(); this.ver(); },

  de(){ return this.invertido ? acharIdioma(Estado.destino, IDIOMAS[1]) : acharIdioma(Estado.origem, IDIOMAS[0]); },
  para(){ return this.invertido ? acharIdioma(Estado.origem, IDIOMAS[0]) : acharIdioma(Estado.destino, IDIOMAS[1]); },

  abas(){
    return `<div class="cv-abas">
      <button class="cv-aba ${this.modo !== 'vivo' ? 'on' : ''}" data-trmodo="normal">✍️ Normal</button>
      <button class="cv-aba ${this.modo === 'vivo' ? 'on' : ''}" data-trmodo="vivo">🎙 Em tempo real</button>
    </div>`;
  },

  ligarAbas(){
    document.querySelectorAll('#v-modulo [data-trmodo]').forEach(b => {
      b.onclick = () => {
        if(b.dataset.trmodo === this.modo) return;
        this.pararVivo();
        this.modo = b.dataset.trmodo;
        this.ver();
      };
    });
  },

  ver(){
    if(this.modo === 'vivo') return this.verVivo();
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="trSair">← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:18px;">Tradutor</h1>
      ${this.abas()}

      <div class="tr-direcao">
        <span class="tr-lado">${this.de().b} ${this.de().n}</span>
        <button class="tr-troca" id="trTroca" aria-label="Inverter">⇄</button>
        <span class="tr-lado">${this.para().b} ${this.para().n}</span>
      </div>

      <textarea id="trTexto" class="es-area" style="min-height:110px;" placeholder="Escreve ou grava…"></textarea>

      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn btn-calmo" id="trGravar" style="flex:0 0 auto;width:58px;padding:14px 0;">🎤</button>
        <button class="btn" id="trTraduzir" style="flex:1;">Traduzir</button>
      </div>
      <div class="gr-dica" id="trDica" style="text-align:center;"></div>

      <div id="trSaida"></div>`;

    document.getElementById('trSair').onclick = () => Rota.ir('praticar');
    document.getElementById('trTroca').onclick = () => { this.invertido = !this.invertido; this.ver(); };
    this.ligarAbas();
    document.getElementById('trTraduzir').onclick = e => this.traduzir(e.currentTarget);
    document.getElementById('trGravar').onclick = () => this.microfone();
  },


  /* ── Tempo real ─────────────────────────────────────────
     Usa o reconhecimento de voz do telemóvel (contínuo e grátis).
     Se o browser não o tiver, grava blocos de 6 s e transcreve-os. */
  modo:'normal', vivo:false, rec:null, segmentos:[], saida:'nenhuma', teveFala:false,
  bloqueio:null, fluxoVivo:null, gravadorVivo:null, temporizador:null,
  fila:null, aFalar:false,

  LOCALES:{pt:'pt-PT',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',zh:'zh-CN',ja:'ja-JP',
           ko:'ko-KR',ar:'ar-SA',ru:'ru-RU',hi:'hi-IN',nl:'nl-NL',sv:'sv-SE',tr:'tr-TR'},

  verVivo(){
    document.getElementById('v-modulo').innerHTML = `
      <button class="voltar" id="trSair">← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:18px;">Tradutor</h1>
      ${this.abas()}

      <div class="tr-direcao">
        <span class="tr-lado">${this.de().b} ${this.de().n}</span>
        <button class="tr-troca" id="trTroca" aria-label="Inverter">⇄</button>
        <span class="tr-lado">${this.para().b} ${this.para().n}</span>
      </div>

      <div class="gr-palco" style="padding-top:4px;">
        <button class="gr-botao" id="tvBotao" aria-label="Ouvir">
          <svg viewBox="0 0 24 24" fill="#fff" width="26" height="26">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/>
          </svg>
        </button>
        <div class="gr-dica" id="tvEstado">Toca para começar a ouvir</div>
      </div>

      <div class="tv-saida">
        <div class="tv-saida-r">Voz da tradução</div>
        <div class="tv-saida-op">
          <button data-saida="nenhuma" class="${this.saida === 'nenhuma' ? 'on' : ''}">Desligada</button>
          <button data-saida="auriculares" class="${this.saida === 'auriculares' ? 'on' : ''}">🎧 Auriculares</button>
          <button data-saida="altifalante" class="${this.saida === 'altifalante' ? 'on' : ''}">🔊 Altifalante</button>
        </div>
        ${this.saida === 'altifalante'
          ? '<div class="tv-saida-n">Com o altifalante, o microfone pausa enquanto a tradução fala.</div>' : ''}
      </div>

      <div class="tv-fio" id="tvFio"></div>
      <div class="tv-parcial" id="tvParcial" data-conteudo></div>

      <div class="tv-acoes">
        <button class="btn btn-calmo" id="tvCopiar">Copiar tudo</button>
        <button class="btn btn-calmo" id="tvLimpar">Limpar</button>
      </div>`;

    document.getElementById('trSair').onclick = () => { this.pararVivo(); Rota.ir('praticar'); };
    document.getElementById('trTroca').onclick = () => {
      const estava = this.vivo;
      this.pararVivo();
      this.invertido = !this.invertido;
      this.verVivo();
      if(estava) this.comecarVivo();
    };
    this.ligarAbas();
    document.getElementById('tvBotao').onclick = () => this.vivo ? this.pararVivo() : this.comecarVivo();
    document.querySelectorAll('#v-modulo [data-saida]').forEach(b => {
      b.onclick = () => {
        this.saida = b.dataset.saida;
        document.querySelectorAll('#v-modulo [data-saida]').forEach(x => x.classList.toggle('on', x === b));
        const n = document.querySelector('#v-modulo .tv-saida-n');
        if(this.saida === 'altifalante' && !n){
          b.closest('.tv-saida').insertAdjacentHTML('beforeend',
            '<div class="tv-saida-n">Com o altifalante, o microfone pausa enquanto a tradução fala.</div>');
        }else if(this.saida !== 'altifalante' && n){ n.remove(); }
        // Trocar de modo cala o que estiver a ser dito e reabre o microfone
        if(window.speechSynthesis) speechSynthesis.cancel();
        this.aFalar = false; this.teveFala = false;
      };
    });
    document.getElementById('tvCopiar').onclick = e => this.copiarTudo(e.currentTarget);
    document.getElementById('tvLimpar').onclick = () => { this.segmentos = []; this.pintarFio(); };

    this.pintarFio();
    this.pintarEstadoVivo();
  },

  pintarFio(){
    const fio = document.getElementById('tvFio');
    if(!fio) return;
    fio.innerHTML = '';
    if(!this.segmentos.length){
      fio.innerHTML = '<div class="tv-vazio">Toca no microfone e fala. A tradução aparece aqui, frase a frase.</div>';
      return;
    }
    this.segmentos.forEach(s => this.pintarSegmento(s));
  },

  pintarSegmento(seg){
    const fio = document.getElementById('tvFio');
    if(!fio) return;
    const vazio = fio.querySelector('.tv-vazio');
    if(vazio) vazio.remove();
    const el = document.createElement('div');
    el.className = 'tv-seg';
    el.setAttribute('data-conteudo', '');
    const tr = document.createElement('div');
    tr.className = 'tv-trad';
    tr.textContent = seg.trad || (seg.falhou ? '—' : '…');
    const og = document.createElement('div');
    og.className = 'tv-orig';
    og.textContent = seg.orig;
    el.appendChild(tr); el.appendChild(og);
    fio.appendChild(el);
    seg.el = el;
    fio.scrollTop = fio.scrollHeight;
  },

  atualizarSegmento(seg){
    if(!seg.el || !seg.el.isConnected) return;
    seg.el.querySelector('.tv-trad').textContent = seg.trad || (seg.falhou ? '—' : '…');
    const fio = document.getElementById('tvFio');
    if(fio) fio.scrollTop = fio.scrollHeight;
  },

  mostrarParcial(txt){
    const p = document.getElementById('tvParcial');
    if(p) p.textContent = txt || '';
  },

  pintarEstadoVivo(msgErro){
    const b = document.getElementById('tvBotao');
    const e = document.getElementById('tvEstado');
    if(b) b.classList.toggle('a-gravar', this.vivo);
    if(!e) return;
    e.classList.toggle('gr-dica-erro', !!msgErro);
    e.textContent = msgErro || (this.vivo ? 'A ouvir — fala à vontade' : 'Toca para começar a ouvir');
  },

  async comecarVivo(){
    this.vivo = true;
    this.pintarEstadoVivo();
    await this.manterEcraLigado();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(SR) this.iniciarReconhecimento(SR);
    else await this.iniciarBlocos();
  },

  iniciarReconhecimento(SR){
    const rec = new SR();
    rec.lang = this.LOCALES[this.de().c] || 'pt-PT';
    rec.continuous = true;
    rec.interimResults = true;

    rec.onresult = ev => {
      // Só com o altifalante é que o microfone ouviria a própria tradução
      if(this.aFalar && this.saida === 'altifalante') return;
      let parcial = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const r = ev.results[i];
        const txt = (r[0] && r[0].transcript || '').trim();
        if(r.isFinal){ if(txt) this.novoSegmento(txt); }
        else parcial += txt + ' ';
      }
      this.mostrarParcial(parcial.trim());
    };
    rec.onerror = ev => {
      if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
        this.pararVivo(); this.pintarEstadoVivo('Sem acesso ao microfone.');
      }else if(ev.error === 'network'){
        this.pararVivo(); this.pintarEstadoVivo('Sem ligação — tenta outra vez.');
      }
    };
    // O reconhecimento pára sozinho depois de um silêncio: recomeçar
    rec.onend = () => {
      if(this.vivo && !document.hidden){
        setTimeout(() => { if(this.vivo && this.rec === rec){ try{ rec.start(); }catch(e){} } }, 250);
      }
    };
    this.rec = rec;
    try{ rec.start(); }catch(e){}
  },

  async iniciarBlocos(){
    try{ this.fluxoVivo = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ this.pararVivo(); this.pintarEstadoVivo('Sem acesso ao microfone.'); return; }

    const ciclo = () => {
      if(!this.vivo || !this.fluxoVivo) return;
      const pedacos = [];
      const g = new MediaRecorder(this.fluxoVivo);
      g.ondataavailable = ev => { if(ev.data.size) pedacos.push(ev.data); };
      g.onstop = () => {
        const blob = new Blob(pedacos, {type:'audio/webm'});
        const apanhouVoz = this.teveFala && this.saida === 'altifalante';
        this.teveFala = this.aFalar;
        if(blob.size > 2000 && !apanhouVoz){
          this.fila = (this.fila || Promise.resolve()).then(() => this.blocoParaTexto(blob));
        }
        ciclo();
      };
      g.start();
      this.gravadorVivo = g;
      this.temporizador = setTimeout(() => { if(g.state !== 'inactive') g.stop(); }, 6000);
    };
    ciclo();
  },

  async blocoParaTexto(blob){
    try{
      const base64 = await new Promise((ok, falha) => {
        const l = new FileReader();
        l.onload = () => ok(String(l.result).split(',')[1]);
        l.onerror = () => falha(new Error('erro'));
        l.readAsDataURL(blob);
      });
      const r = await Rede.correr('transcrever', {audio_base64:base64});
      const txt = (r && r.texto || '').trim();
      if(txt) await this.novoSegmento(txt);
    }catch(e){}
  },

  async novoSegmento(orig){
    // Com altifalante, o que se ouve enquanto a tradução fala é eco
    if(this.aFalar && this.saida === 'altifalante') return;
    const seg = {orig, trad:''};
    this.segmentos.push(seg);
    this.pintarSegmento(seg);
    this.mostrarParcial('');
    try{
      const r = await Rede.correr('traduzir', {texto:orig, de:this.de().n, para:this.para().n});
      seg.trad = (r && r.traducao || '').trim();
    }catch(e){ seg.falhou = true; }
    this.atualizarSegmento(seg);
    if(seg.trad && this.saida !== 'nenhuma' && this.vivo) this.dizer(seg.trad);
  },

  dizer(texto){
    if(!window.speechSynthesis) return;
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = this.LOCALES[this.para().c] || 'en-US';
    u.onstart = () => { this.aFalar = true; this.teveFala = true; };
    u.onend = u.onerror = () => { setTimeout(() => { this.aFalar = false; }, 350); };
    speechSynthesis.speak(u);
  },

  async manterEcraLigado(){
    if(!('wakeLock' in navigator)) return;
    try{ this.bloqueio = await navigator.wakeLock.request('screen'); }catch(e){}
  },

  pararVivo(){
    const estava = this.vivo;
    this.vivo = false;
    if(this.rec){ this.rec.onend = null; try{ this.rec.stop(); }catch(e){} this.rec = null; }
    if(this.temporizador){ clearTimeout(this.temporizador); this.temporizador = null; }
    if(this.gravadorVivo && this.gravadorVivo.state !== 'inactive'){
      this.gravadorVivo.onstop = null; this.gravadorVivo.stop();
    }
    this.gravadorVivo = null;
    if(this.fluxoVivo){ this.fluxoVivo.getTracks().forEach(t => t.stop()); this.fluxoVivo = null; }
    if(this.bloqueio){ this.bloqueio.release().catch(() => {}); this.bloqueio = null; }
    if(window.speechSynthesis && estava) speechSynthesis.cancel();
    this.aFalar = false;
    this.mostrarParcial('');
    this.pintarEstadoVivo();
  },

  async copiarTudo(botao){
    const texto = this.segmentos.map(s => s.orig + '\n' + (s.trad || '')).join('\n\n');
    if(!texto) return;
    try{
      await navigator.clipboard.writeText(texto);
      botao.textContent = 'Copiado ✓';
      setTimeout(() => { botao.textContent = tp('Copiar tudo'); }, 1800);
    }catch(e){}
  },

  async microfone(){
    const b = document.getElementById('trGravar');
    const dica = document.getElementById('trDica');

    if(this.aGravar){
      if(this.gravador && this.gravador.state !== 'inactive') this.gravador.stop();
      if(this.fluxo) this.fluxo.getTracks().forEach(t => t.stop());
      this.aGravar = false;
      b.classList.remove('a-gravar');
      dica.textContent = 'A transcrever…';
      return;
    }

    try{ this.fluxo = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ dica.textContent = 'Sem acesso ao microfone.'; return; }

    this.pedacos = [];
    this.gravador = new MediaRecorder(this.fluxo);
    this.gravador.ondataavailable = ev => { if(ev.data.size) this.pedacos.push(ev.data); };
    this.gravador.onstop = () => this.transcrever();
    this.gravador.start();
    this.aGravar = true;
    b.classList.add('a-gravar');
    dica.textContent = 'A gravar… toca para parar';
  },

  async transcrever(){
    const dica = document.getElementById('trDica');
    try{
      const blob = new Blob(this.pedacos, {type:'audio/webm'});
      const base64 = await new Promise((ok,f) => {
