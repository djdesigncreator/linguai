<!-- LINGUAI-VERSAO-19 · espera animada e sessão única · live -->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081B44">
<title>Lingu.AI</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lingu.AI">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════════════════════
   LINGU.AI — sistema de design
   ══════════════════════════════════════════════════════════ */
:root{
  --indigo:#081B44;
  --indigo-80:#17366F;
  --indigo-40:#496B9F;
  --lima:#7CFF00;
  --coral:#F51F47;
  --teal:#16B8A6;
  --papel:#F7FAFC;
  --branco:#FFFFFF;
  --linha:#DCE5EF;
  --texto:#081B44;
  --texto-suave:#5E6B80;

  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --sombra:0 2px 14px rgba(8,27,68,.07);
  --sombra-alta:0 12px 34px rgba(8,27,68,.16);
  --nav-h:76px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--papel);
  color:var(--texto);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Yusei Magic',cursive;font-weight:400;line-height:1.28;}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:3px;border-radius:4px;}

/* ── Estrutura ────────────────────────────────────────── */
#app{min-height:100%;display:flex;flex-direction:column;}
#ecra{
  flex:1;
  width:100%;max-width:520px;margin:0 auto;
  padding:14px 18px calc(var(--nav-h) + 26px);
}
.vista{display:none;animation:entra .26s cubic-bezier(.2,.7,.3,1);}
.vista.on{display:block;}
@keyframes entra{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ── Barra superior ───────────────────────────────────── */
.topo{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:6px 0 18px;
}
.marca{display:flex;align-items:center;gap:8px;font-family:'Yusei Magic',cursive;font-size:19px;}
.marca b{color:var(--lima);font-weight:400;}
.marca svg{width:26px;height:26px;flex:0 0 auto;}

.par-linguas{
  display:flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:999px;
  background:var(--branco);border:1.5px solid var(--linha);
  font-size:17px;line-height:1;
}
.par-linguas .seta{font-size:11px;color:var(--indigo-40);}

/* ── Cartões ──────────────────────────────────────────── */
.cartao{
  background:var(--branco);border:1.5px solid var(--linha);
  border-radius:var(--r-lg);padding:20px;margin-bottom:14px;
}
.cartao-escuro{
  background:var(--indigo);color:#fff;border:0;
  border-radius:var(--r-xl);padding:24px 22px;margin-bottom:16px;
  box-shadow:var(--sombra-alta);
}

/* ── Progresso do plano ───────────────────────────────── */
.plano-nota{
  text-align:center;font-size:13.5px;color:#CFC7E4;
  margin-bottom:18px;line-height:1.45;
}
.perfil-linha{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.avatar{
  width:54px;height:54px;flex:0 0 auto;border-radius:50%;
  background:var(--lima);color:var(--indigo);
  display:flex;align-items:center;justify-content:center;
  font-family:'Yusei Magic',cursive;font-size:22px;
}
.perfil-nome{flex:1 1 130px;min-width:0;}
.perfil-nome .nome{font-size:16px;color:var(--lima);line-height:1.25;}
.perfil-nome .meta{font-size:12.5px;color:#CFC7E4;margin-top:2px;}

.estatisticas{display:flex;gap:8px;flex:1 1 180px;}
.estat{flex:1;text-align:center;}
.estat .n{font-family:'Yusei Magic',cursive;font-size:21px;color:#fff;line-height:1;}
.estat .r{font-size:11px;color:#CFC7E4;margin-top:5px;line-height:1.2;}

.barra-zona{display:flex;align-items:center;gap:12px;}
.barra{flex:1;position:relative;height:11px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;}
.barra-fill{
  position:absolute;inset:0 auto 0 0;width:0;
  background:var(--lima);border-radius:999px;
  transition:width .9s cubic-bezier(.2,.7,.3,1);
}
.barra-rotulo{font-size:12px;color:#CFC7E4;margin-top:8px;}
.barra-txt{font-family:'Yusei Magic',cursive;font-size:17px;color:var(--lima);flex:0 0 auto;}

/* ── Menu de práticas ─────────────────────────────────── */
.seccao-titulo{font-size:13px;color:var(--texto-suave);margin:22px 4px 12px;}

.pratica{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:17px 16px;border-radius:var(--r-lg);margin-bottom:11px;
  text-align:left;transition:transform .14s;
}
.pratica:active{transform:scale(.985);}
.pratica .ic{
  width:44px;height:44px;flex:0 0 auto;border-radius:13px;
  background:rgba(255,255,255,.82);
  display:flex;align-items:center;justify-content:center;
}
.pratica .ic svg{width:21px;height:21px;}
.pratica .txt{display:block;flex:1;min-width:0;}
.pratica .t{display:block;font-family:'Yusei Magic',cursive;font-size:15.5px;line-height:1.3;}
.pratica .d{display:block;font-size:12.5px;opacity:.72;margin-top:3px;line-height:1.35;}
.pratica .chev{flex:0 0 auto;opacity:.5;}

.p-licoes {background:#8B7BF0;color:#1B1040;}
.p-conversa{background:#A5E3C0;color:#12503A;}
.p-verbos {background:#F5B5AB;color:#6E2D25;}
.p-escrita {background:#F9D08B;color:#6B4413;}
.p-vocab  {background:#A9C5E8;color:#1B3A63;}
.p-traduz {background:#D9C6F0;color:#3B2159;}

/* ── Espera ───────────────────────────────────────────── */
.esp{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:54px 20px;text-align:center;}
.esp-palco{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;}
.esp-prof{width:108px;height:108px;overflow:visible;}
.esp-corpo{animation:espRespira 2.6s ease-in-out infinite;transform-origin:60px 70px;}
.esp-balao{fill:var(--branco);stroke:var(--indigo);stroke-width:5;stroke-linejoin:round;}
.esp-olho{fill:var(--indigo);animation:espPisca 4.2s ease-in-out infinite;transform-origin:44px 50px;}
.esp-boca{fill:none;stroke:var(--coral);stroke-width:5;stroke-linecap:round;animation:espFala 1.1s ease-in-out infinite;transform-origin:70px 69px;}
.esp-ondas path{fill:none;stroke:var(--teal);stroke-width:4;stroke-linecap:round;opacity:0;}
.esp-ondas path:nth-child(1){animation:espOnda 1.8s ease-out infinite;}
.esp-ondas path:nth-child(2){animation:espOnda 1.8s ease-out .35s infinite;}
.esp-pontos{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:5px;}
.esp-pontos i{width:6px;height:6px;border-radius:50%;background:var(--lima);animation:espSalta 1s ease-in-out infinite;}
.esp-pontos i:nth-child(2){animation-delay:.16s;}
.esp-pontos i:nth-child(3){animation-delay:.32s;}
.esp-txt{margin-top:22px;font-size:14.5px;color:var(--texto-suave);line-height:1.5;transition:opacity .22s;max-width:280px;}

@keyframes espRespira{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-5px) scale(1.02);}}
@keyframes espPisca{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
@keyframes espFala{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.55);}}
@keyframes espOnda{0%{opacity:0;transform:translateX(-5px);}35%{opacity:1;}100%{opacity:0;transform:translateX(5px);}}
@keyframes espSalta{0%,72%,100%{opacity:.3;transform:none;}36%{opacity:1;transform:translateY(-4px);}}

/* ── Botão que está a falar ───────────────────────────── */
.a-falar{background:var(--teal)!important;animation:fala 1.1s ease-in-out infinite;}
.a-falar svg{fill:#fff!important;}
@keyframes fala{
  0%,100%{box-shadow:0 0 0 0 rgba(22,184,166,.5);}
  60%{box-shadow:0 0 0 8px rgba(22,184,166,0);}
}

/* ── Retomar e histórico ──────────────────────────────── */
.retomar{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;margin-bottom:11px;
  border-radius:var(--r-lg);background:var(--branco);border:1.5px dashed var(--teal);text-align:left;}
.retomar:active{transform:scale(.985);}
.ret-ic{font-size:22px;flex:0 0 auto;}
.ret-txt{flex:1;min-width:0;}
.ret-t{display:block;font-family:'Yusei Magic',cursive;font-size:15px;line-height:1.3;}
.ret-d{display:block;font-size:12px;color:var(--texto-suave);margin-top:2px;}
.ret-seta{flex:0 0 auto;color:var(--teal);font-size:17px;}
.hist-linha{display:flex;align-items:center;gap:12px;background:var(--branco);border:1.5px solid var(--linha);
  border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px;}
.hist-ic{font-size:19px;flex:0 0 auto;}
.hist-txt{flex:1;min-width:0;}
.hist-t{display:block;font-size:14.5px;font-weight:600;line-height:1.35;}
.hist-d{display:block;font-size:12px;color:var(--texto-suave);margin-top:2px;}
.hist-n{flex:0 0 auto;font-family:'Yusei Magic',cursive;font-size:16px;color:var(--teal);}

/* ── Navegação inferior ───────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--branco);border-top:1.5px solid var(--linha);
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
}
.nav-int{display:flex;max-width:520px;margin:0 auto;}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 2px;font-size:11px;color:var(--texto-suave);
  transition:color .16s;
}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.on{color:var(--indigo);}
.nav-btn.on svg{stroke:var(--indigo);}
.nav-btn svg{stroke:currentColor;fill:none;stroke-width:1.9;}

/* ── Estados ──────────────────────────────────────────── */
.carregar{display:flex;align-items:center;justify-content:center;gap:9px;padding:42px 0;color:var(--texto-suave);font-size:14px;}
.pontos{display:inline-flex;gap:4px;}
.pontos i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:salta 1s ease-in-out infinite;}
.pontos i:nth-child(2){animation-delay:.16s;}
.pontos i:nth-child(3){animation-delay:.32s;}
@keyframes salta{0%,72%,100%{opacity:.3;transform:none;}36%{opacity:1;transform:translateY(-4px);}}

.vazio{text-align:center;padding:52px 20px;color:var(--texto-suave);}
.vazio .t{font-family:'Yusei Magic',cursive;font-size:17px;color:var(--texto);margin-bottom:7px;}
.vazio .d{font-size:13.5px;line-height:1.55;}

.aviso{
  background:#FFF4E5;border:1.5px solid #F0C88A;border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.55;color:#6B4413;
}

/* ── Botões ───────────────────────────────────────────── */
.btn{
  display:block;width:100%;padding:16px;border-radius:var(--r-md);
  background:var(--coral);color:#fff;text-align:center;
  font-family:'Yusei Magic',cursive;font-size:15.5px;
  transition:transform .14s,opacity .14s;
}
.btn:active{transform:scale(.99);}
.btn:disabled{opacity:.6;}
.btn-calmo{background:var(--branco);color:var(--texto);border:1.5px solid var(--linha);}

.voltar{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;color:var(--texto-suave);
  margin-bottom:14px;padding:4px 0;
}

/* ── Escolhas (nível, tema) ───────────────────────────── */
.escolhas{display:flex;flex-direction:column;gap:10px;}
.escolha{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px;border-radius:var(--r-md);
  background:var(--branco);border:1.5px solid var(--linha);
  font-weight:600;font-size:14.5px;text-align:left;
}
.escolha:active{border-color:var(--teal);background:rgba(22,184,166,.05);}






/* ── Instalar (PWA) ───────────────────────────────────── */
.pwa-barra{display:none;position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px);z-index:60;
  max-width:496px;margin:0 auto;align-items:center;gap:12px;
  background:var(--indigo);color:#fff;border-radius:var(--r-lg);padding:14px 16px;
  box-shadow:var(--sombra-alta);animation:entra .3s cubic-bezier(.2,.7,.3,1);}
.pwa-barra.on{display:flex;}
.pwa-txt{flex:1;min-width:0;}
.pwa-t{font-family:'Yusei Magic',cursive;font-size:14.5px;}
.pwa-d{font-size:12px;color:#CFC7E4;margin-top:2px;line-height:1.35;}
.pwa-sim{flex:0 0 auto;background:var(--lima);color:var(--indigo);border-radius:999px;
  padding:10px 14px;font-weight:700;font-size:12.5px;white-space:nowrap;}
.pwa-nao{flex:0 0 auto;width:28px;height:28px;color:#CFC7E4;font-size:13px;}
body.em-login .pwa-barra,body.em-entrada .pwa-barra{bottom:16px;}

.av-cartao{border-color:#F0C88A;background:#FFF7EC;}
.av-cartao.av-on{border-color:var(--teal);background:rgba(22,184,166,.06);}
.av-t{font-family:'Yusei Magic',cursive;font-size:15.5px;margin-bottom:6px;}
.av-d{font-size:13px;color:var(--texto-suave);line-height:1.55;}

/* ── Login ────────────────────────────────────────────── */
body.em-login .nav,body.em-login .topo{display:none;}
body.em-login #ecra{padding-top:34px;padding-bottom:40px;}
.lg-topo{text-align:center;margin-bottom:26px;}
.lg-marca{width:54px;height:54px;margin:0 auto 14px;display:block;}
.lg-nome{font-family:'Yusei Magic',cursive;font-size:25px;}
.lg-nome b{color:var(--lima);font-weight:400;}
.lg-lema{font-size:13.5px;color:var(--texto-suave);margin-top:10px;line-height:1.55;}
.cod-caixa{display:flex;gap:8px;justify-content:center;margin:6px 0 4px;}
.cod-d{width:46px;height:56px;text-align:center;font-family:'Yusei Magic',cursive;font-size:24px;
  border:1.5px solid var(--linha);border-radius:var(--r-md);background:var(--branco);color:var(--texto);}
.cod-d:focus{outline:none;border-color:var(--teal);background:rgba(22,184,166,.04);}
.lg-senha{position:relative;}
.lg-senha .campo{padding-right:48px;}
.lg-olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;font-size:15px;}
.lg-link{display:block;width:100%;margin-top:14px;padding:10px;text-align:center;font-size:13px;font-weight:600;color:var(--texto-suave);}
.lg-fundo{text-align:center;margin-top:26px;padding-top:20px;border-top:1.5px solid var(--linha);font-size:13.5px;color:var(--texto-suave);}
.lg-troca{font-weight:700;color:var(--coral);font-size:13.5px;}

.lic-eq{display:flex;align-items:flex-end;gap:2.5px;height:13px;}
.lic-eq i{width:2.5px;height:3px;border-radius:2px;background:var(--lima);opacity:.35;transition:opacity .2s;}
.lic-eq.a-tocar i{opacity:1;animation:eqSalta .9s ease-in-out infinite;}
.lic-eq.a-tocar i:nth-child(2){animation-delay:.15s;}
.lic-eq.a-tocar i:nth-child(3){animation-delay:.3s;}
.lic-eq.a-tocar i:nth-child(4){animation-delay:.45s;}
.lic-eq.a-tocar i:nth-child(5){animation-delay:.6s;}
@keyframes eqSalta{0%,100%{height:3px;}50%{height:13px;}}

.lic-audio-espera{display:flex;align-items:center;gap:10px;background:var(--branco);border:1.5px dashed var(--linha);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px;font-size:13px;color:var(--texto-suave);}

/* ── Conversação ──────────────────────────────────────── */
.cv-abas{display:flex;gap:8px;margin-bottom:18px;}
.cv-aba{flex:1;padding:12px 8px;border-radius:var(--r-md);background:var(--branco);border:1.5px solid var(--linha);font-size:13px;font-weight:600;}
.cv-aba.on{background:var(--indigo);color:#fff;border-color:var(--indigo);}
.cv-niveis{display:flex;gap:8px;}
.cv-nivel{flex:1;padding:10px 6px;border-radius:999px;background:var(--branco);border:1.5px solid var(--linha);font-size:12.5px;font-weight:600;}
.cv-nivel.on{background:rgba(22,184,166,.1);border-color:var(--teal);color:var(--teal);}
.cv-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.cv-tema{font-family:'Yusei Magic',cursive;font-size:19px;}
.cv-sub{font-size:12.5px;color:var(--texto-suave);margin-top:2px;}
.cv-fim{padding:9px 15px;border-radius:999px;background:var(--branco);border:1.5px solid var(--linha);font-size:12.5px;font-weight:600;color:var(--coral);flex:0 0 auto;}
.cv-fio{min-height:36vh;max-height:46vh;overflow-y:auto;padding:4px 0 8px;margin-bottom:8px;}
.cv-vazio{text-align:center;padding:44px 20px;color:var(--texto-suave);font-size:13.5px;line-height:1.6;}
.cv-trad{font-size:12.5px;color:var(--texto-suave);margin-top:5px;padding:0 4px;line-height:1.45;}
.cv-palco{text-align:center;padding-top:10px;border-top:1.5px solid var(--linha);}
.cv-sugestao{background:#FFF7EC;border:1.5px solid #F0C88A;border-radius:var(--r-md);padding:15px 16px;margin-top:14px;font-size:13.5px;}
.cv-modelo{background:var(--branco);border:1.5px solid var(--linha);border-radius:var(--r-lg);margin-bottom:11px;overflow:hidden;}
.cv-modelo-topo{display:flex;align-items:center;gap:12px;padding:16px;cursor:pointer;}
.cv-modelo-t{font-family:'Yusei Magic',cursive;font-size:15.5px;line-height:1.3;}
.cv-modelo-d{font-size:12.5px;color:var(--texto-suave);margin-top:2px;line-height:1.35;}
.cv-modelo-n{display:inline-block;margin-top:7px;font-size:10.5px;font-weight:600;color:var(--texto-suave);background:var(--papel);padding:3px 9px;border-radius:999px;}
.cv-modelo-corpo:not(:empty){padding:0 16px 16px;}
.cv-fala{padding:12px 14px;border-radius:var(--r-md);margin-bottom:8px;}
.cv-fala.fa{background:rgba(22,184,166,.07);margin-right:20px;}
.cv-fala.fb{background:rgba(245,31,71,.07);margin-left:20px;}
.cv-fala-alvo{font-size:14.5px;font-weight:600;line-height:1.45;}
.cv-fala-ouvir{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(8,27,68,.08);margin-left:6px;vertical-align:middle;color:var(--indigo);}
.cv-fala-orig{font-size:12.5px;color:var(--texto-suave);margin-top:3px;line-height:1.4;}
.cv-fala-pron{font-size:11.5px;color:var(--teal);font-style:italic;margin-top:4px;}
/* ── Vocabulário ──────────────────────────────────────── */
.vc-imagem{background:var(--branco);border:1.5px solid var(--linha);border-radius:var(--r-xl);padding:20px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;min-height:210px;}
.vc-imagem img{width:180px;height:180px;object-fit:contain;}
/* ── Escrita ──────────────────────────────────────────── */
.mini-rotulo{font-size:11px;font-weight:600;color:var(--texto-suave);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;}
.es-area{width:100%;min-height:150px;border:1.5px solid var(--linha);border-radius:var(--r-md);padding:15px;font-family:inherit;font-size:15px;line-height:1.6;resize:vertical;background:var(--branco);color:var(--texto);}
.es-area:focus{outline:none;border-color:var(--teal);}
.es-conta{text-align:right;font-size:12px;color:var(--texto-suave);margin:7px 2px 14px;}

.pg-nota-pais{font-size:12.5px;color:var(--texto-suave);line-height:1.5;margin-bottom:14px;}

/* ══════════════════════════════════════════════════════════
   INTERFACE — traduz o ecrã inteiro, e tudo o que aparecer depois
   Não toca no conteúdo das aulas (frases, respostas, conversas),
   que tem de ficar na língua que se está a aprender.

const SEM_TRADUZIR = [
  '#v-entrada', '#licFrases', '.ex-enunciado', '#exOpcoes', '.ex-reacao-d', '#vcOpcoes',
  '.vb-cartao', '#cvFio', '.cv-modelo-corpo', '.asst-bolha', '#trSaida', '.tr-lado',
  '.gr-alvo', '.gr-pron', '.gr-ouvido-t', '.es-erro', '[data-conteudo]', 'script', 'style', 'textarea'
].join(',');

const Interface = {
  mapa:null, moldes:[], obs:null,

  ativo(){ return Estado.origem !== 'pt' && Object.keys(Estado.textos || {}).length > 0; },

  construir(){
    this.mapa = {}; this.moldes = [];
    Object.keys(RESERVA).forEach(k => {
      const v = String(RESERVA[k]).trim();
      if(/\{[nmxyp]\}/.test(v)){
        const nomes = [];
        const re = '^' + v.split(/(\{[nmxyp]\})/).map(p => {
          const m = p.match(/^\{([nmxyp])\}$/);
          if(m){ nomes.push(m[1]); return (m[1] === 'n' || m[1] === 'm') ? '(\\d+)' : '(.+?)'; }
          return p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }).join('') + '$';
        this.moldes.push({k, re:new RegExp(re, 'u'), nomes});
      }else if(!this.mapa[v]){
        this.mapa[v] = k;
      }
    });
  },

  // Devolve a tradução de um texto em português, ou null
  texto(s){
    if(!this.mapa) this.construir();
    const limpo = String(s || '').trim();
    if(!limpo) return null;

    const k = this.mapa[limpo];
    if(k && Estado.textos[k]) return Estado.textos[k];

    for(const m of this.moldes){
      const r = limpo.match(m.re);
      if(!r) continue;
      let saida = Estado.textos[m.k];
      if(!saida) return null;
      m.nomes.forEach((nome, i) => {
        let val = r[i + 1];
        if(nome === 'p') val = this.texto(val) || val;
        saida = saida.split('{' + nome + '}').join(val);
      });
      return saida;
    }

    if(limpo.indexOf(' · ') > -1){
      const partes = limpo.split(' · ');
      const trad = partes.map(p => this.texto(p) || p);
      return trad.some((p, i) => p !== partes[i]) ? trad.join(' · ') : null;
    }

    const num = limpo.match(/^(\d+)\s+(.+)$/u);
    if(num){ const t2 = this.texto(num[2]); if(t2) return num[1] + ' ' + t2; }

    const vol = limpo.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}?.!]*)$/u);
    if(vol && (vol[1] || vol[3]) && vol[2] && vol[2] !== limpo){
      const t3 = this.texto(vol[2]);
      if(t3) return vol[1] + t3 + vol[3];
    }
    return null;
  },

  aplicar(raiz){
    if(!raiz || !this.ativo()) return;
    const nos = [];
    if(raiz.nodeType === 3) nos.push(raiz);
    else if(raiz.nodeType === 1){
      const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
      let n; while((n = w.nextNode())) nos.push(n);
    }
    nos.forEach(n => {
      const pai = n.parentElement;
      if(!pai || pai.closest(SEM_TRADUZIR)) return;
      const tr = this.texto(n.nodeValue);
      if(tr && tr !== n.nodeValue.trim()){
        n.nodeValue = n.nodeValue.match(/^\s*/)[0] + tr + n.nodeValue.match(/\s*$/)[0];
      }
    });
    if(raiz.nodeType === 1){
      [raiz, ...raiz.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(el => {
        if(el.closest(SEM_TRADUZIR)) return;
        ['placeholder','aria-label','title'].forEach(a => {
          if(!el.hasAttribute(a)) return;
          const tr = this.texto(el.getAttribute(a));
          if(tr) el.setAttribute(a, tr);
        });
      });
    }
  },

  vigiar(){
    if(!this.ativo()) return;
    this.construir();
    this.aplicar(document.body);
    if(this.obs) return;
    this.obs = new MutationObserver(ms => {
      ms.forEach(m => m.addedNodes.forEach(n => this.aplicar(n)));
    });
    this.obs.observe(document.body, {childList:true, subtree:true});
  },

  // Os textos que vivem em listas (temas, planos, conquistas…) entram no dicionário
  registar(){
    const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
                       .replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 44);
    const existe = new Set(Object.values(RESERVA).map(v => String(v).trim()));
    const juntar = s => {
      if(!s || existe.has(s)) return;
      let k = 'd_' + slug(s), i = 2;
      while(RESERVA[k] !== undefined) k = 'd_' + slug(s) + '_' + (i++);
      RESERVA[k] = s; existe.add(s);
    };
    Object.values(TEMAS.pt || {}).forEach(l => l.forEach(juntar));
    TEMAS_CONVERSA.forEach(x => { juntar(x.t); juntar(x.d); });
    TEMAS_ESCRITA.forEach(juntar);
    Object.values(CATEGORIAS).forEach(juntar);
    PLANOS.forEach(p => { juntar(p.nome); juntar(p.periodo); p.itens.forEach(juntar); });
    METODOS.forEach(m => juntar(m.sub));
    METAS.forEach(m => { juntar(m.nome); juntar(m.d); });
    CONQUISTAS.forEach(x => { juntar(x.nome); juntar(x.d); });
    SUGESTOES.forEach(x => { juntar(x.r); juntar(x.m); });
    this.mapa = null;
  }
};

// Ações que consomem tempo de estudo — bloqueadas sem plano
const ACOES_PAGAS = [
  'gerar_licao','gerar_audio_licao','avaliar_gravacao','conversar','gerar_voz',
  'gerar_dialogo','avaliar_conversa_final','gerar_verbos','avaliar_escrita',
  'traduzir','transcrever','assistente'
];

/* ══════════════════════════════════════════════════════════
   VIGIA — bloqueia assim que o tempo acaba
   ══════════════════════════════════════════════════════════ */
const Vigia = {
  tique:null,

  comecar(){
    if(this.tique) return;
    // De dois em dois minutos, confirma que a conta não foi aberta noutro sítio
    setInterval(async () => {
      if(!Estado.utilizador || document.hidden) return;
      try{
        const r = await Rede.correr('me');
        if(r && r.sessao) Sessao.verificar(r.sessao);
      }catch(e){}
    }, 120000);

    this.tique = setInterval(() => {
      if(Rota.podeUsar()) return;
      // Acabou o tempo a meio de uma prática
      if(Estado.vista === 'modulo') Rota.barrar();
      else if(Estado.vista === 'inicio') Rota.ir('inicio');   // refresca o cartão
    }, 20000);
  }
};

const Rede = {
  token(){
    try{ return localStorage.getItem('linguai:token') || ''; }catch(e){ return ''; }
  },
  guardarToken(t){
    try{ t ? localStorage.setItem('linguai:token', t) : localStorage.removeItem('linguai:token'); }catch(e){}
  },

  async pedir(url, opcoes = {}){
    const cabecalhos = {'Content-Type':'application/json', ...(opcoes.headers || {})};
    const t = this.token();
    if(t) cabecalhos['Authorization'] = 'Bearer ' + t;

    const r = await fetch(url, {
      ...opcoes,
      headers:cabecalhos
    });
    if(!r.ok){
      const corpo = await r.text().catch(() => '');
      throw new Error(`${r.status} — ${corpo.slice(0,160)}`);
    }
    return r.json();
  },

  // Lê registos de um Data Type
  listar(tipo, restricoes){
    let url = API.dados(tipo);
    if(restricoes) url += '?constraints=' + encodeURIComponent(JSON.stringify(restricoes));
    return this.pedir(url).then(d => (d.response && d.response.results) || []);
  },

  // Chama um Backend Workflow (a chave da OpenAI fica no servidor)
  correr(evento, dados){
    // Sem plano e sem minutos, nada que gaste IA passa daqui
    if(ACOES_PAGAS.indexOf(evento) > -1 && typeof Rota !== 'undefined' && !Rota.podeUsar()){
      Rota.barrar();
      return Promise.reject(new Error('sem_plano'));
    }
    return this.pedir(API.wf(evento), {
      method:'POST', body:JSON.stringify(dados || {})
    }).then(d => {
      const resp = d.response || {};
      // O Bubble devolve um token no login e no registo — guardá-lo é o que mantém a sessão
      if(resp.token) this.guardarToken(resp.token);
      // A sessão só se guarda ao entrar — nas outras respostas serve para comparar
      if(resp.sessao && (evento === 'entrar' || evento === 'criar_conta')) Sessao.guardar(resp.sessao);
      return resp;
    });
  }
};

    const atual = qual === 'origem' ? Estado.origem : Estado.destino;

    fundo.style.cssText = 'position:fixed;inset:0;background:rgba(8,27,68,.46);z-index:90;display:flex;align-items:flex-end;justify-content:center;';
    fundo.innerHTML = `

      </div>`;
    document.body.appendChild(fundo);

    fundo.querySelectorAll('[data-cod]').forEach(b => {
      b.onclick = async () => {
        const antesO = Estado.origem, antesD = Estado.destino;

        if(qual === 'origem') Estado.origem = b.dataset.cod;
        else Estado.destino = b.dataset.cod;

        // Mostra que está a trabalhar
        b.style.opacity = '.5';
        fundo.querySelectorAll('[data-cod]').forEach(x => x.disabled = true);

        const gravou = await Nucleo.guardarIdiomas();

        if(!gravou){
          // Repõe e avisa, em vez de fingir que mudou
          Estado.origem = antesO; Estado.destino = antesD;
          b.style.opacity = '1';
          fundo.querySelectorAll('[data-cod]').forEach(x => x.disabled = false);
          const aviso = fundo.querySelector('#selErro');

            aviso.textContent = 'Não consegui guardar. Verifica a ligação e tenta de novo.';

          return;

        Estado.guardar();

        if(qual === 'destino' && antesD !== Estado.destino){
          try{ localStorage.removeItem('linguai:nivel'); }catch(e){}
          fundo.remove();
          return Seletor.oferecerTeste();

        // Recarrega, para tudo nascer já na língua nova
        location.reload();
      };
    });

    const fechar = () => fundo.remove();
    fundo.querySelector('#fecharSel').onclick = fechar;
    fundo.onclick = e => { if(e.target === fundo) fechar(); };

const Rota = {
  ir(vista){
    if(typeof Tradutor !== 'undefined' && Tradutor.vivo) Tradutor.pararVivo();
    Estado.vista = vista;
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
    const alvo = document.getElementById('v-' + vista);
    if(alvo) alvo.classList.add('on');

    document.querySelectorAll('.nav-btn').forEach(b =>
      b.classList.toggle('on', b.dataset.vista === vista));

    if(Ecras[vista]) Ecras[vista]();
    window.scrollTo({top:0, behavior:'smooth'});
  },

  mostrarModulo(){
    Estado.vista = 'modulo';
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
    document.getElementById('v-modulo').classList.add('on');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
    window.scrollTo({top:0, behavior:'smooth'});
  },

  // Uma só verificação, usada em todo o lado
  podeUsar(){
    const u = Estado.utilizador || {};
    if(!u.expira) return true;                 // sem data, deixa passar
    return new Date(u.expira).getTime() > Date.now();
  },

  // Quanto falta, em texto curto
  restante(){
    const u = Estado.utilizador || {};
    if(!u.expira) return '';
    const ms = new Date(u.expira).getTime() - Date.now();
    if(ms <= 0) return '';

    const min = Math.floor(ms / 60000);
    if(min < 60) return min + (min === 1 ? ' minuto' : ' minutos');

    const horas = Math.floor(min / 60);
    if(horas < 24) return horas + (horas === 1 ? ' hora' : ' horas');

    const dias = Math.floor(horas / 24);
    return dias + (dias === 1 ? ' dia' : ' dias');
  },

  barrar(){
    Rota.ir('planos');
  },

  abrirPratica(id){
    if(!this.podeUsar()){ this.barrar(); return; }
    const modulos = {
      licoes:  () => Licoes.abrir(),
      escrita: () => Escrita.abrir(),
      verbos:  () => Verbos.abrir(),
      traduz:  () => Tradutor.abrir(),
      vocab:   () => Vocabulario.abrir(),
      conversa:() => Conversa.abrir()
    };
    if(modulos[id]) return modulos[id]();
    this.mostrarModulo();
    document.getElementById('v-modulo').innerHTML =
      '<button class="voltar" id="volt">← ' + t('voltar') + '</button>' +
      '<div class="vazio"><div class="t">Em migração</div>' +
      '<div class="d">Este módulo ainda vive na versão antiga da app.</div></div>';
    document.getElementById('volt').onclick = () => Rota.ir('praticar');
  }
};

const Licoes = {
  nivel:null, temas:[], pagina:0, POR_PAG:8,
  licao:null, fraseSel:0, paginaFrase:0, FRASES_POR_PAG:5,
  audio:null, lento:false,

  alvo(){ return document.getElementById('v-modulo'); },

  abrir(){
    Rota.mostrarModulo();
    this.nivel = null;
    try{ this.nivel = localStorage.getItem('linguai:nivel'); }catch(e){}

  // ── 1. Nível ──────────────────────────────────────────
  verNiveis(){
    const niveis = [
      {v:'Iniciante',  k:'iniciante'},
      {v:'Intermédio', k:'intermedio'},
      {v:'Avançado',   k:'avancado'}
    ];

      <button class="voltar" data-sair>← ${t('voltar')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">${t('qual_nivel')}</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">Podes mudar quando quiseres.</p>
      <div class="escolhas">
        ${niveis.map(n => `<button class="escolha" data-nivel="${n.v}">${t(n.k)}<span style="color:var(--indigo-40)">→</span></button>`).join('')}
      </div>`;
    window.scrollTo({top:0, behavior:'smooth'});
    this.alvo().querySelector('[data-sair]').onclick = () => Rota.ir('praticar');
    this.alvo().querySelectorAll('[data-nivel]').forEach(b => {
      b.onclick = () => {
        this.nivel = b.dataset.nivel;
        try{ localStorage.setItem('linguai:nivel', this.nivel); }catch(e){}
        this.pagina = 0;
        this.verTemas();
      };
    });
  },

  // ── 2. Tema ───────────────────────────────────────────
  verTemas(){
    const banco = TEMAS[Estado.origem] || TEMAS.pt;
    this.temas = banco[this.nivel] || banco.Iniciante;

    const total = Math.ceil(this.temas.length / this.POR_PAG);
    const ini = this.pagina * this.POR_PAG;
    const lote = this.temas.slice(ini, ini + this.POR_PAG);

    this.alvo().innerHTML = `
      <button class="voltar" data-mudar-nivel>← ${t('qual_nivel')}</button>
      <h1 style="font-size:22px;margin-bottom:6px;">${t('escolhe_tema')}</h1>
      <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">${this.nivel} · ${this.temas.length} temas</p>
      <div class="escolhas">
        ${lote.map(x => `<button class="escolha" data-tema="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}
      </div>
      ${total > 1 ? `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;">
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-pag="-1" ${this.pagina===0?'disabled':''}>← ${t('anterior')||'Anterior'}</button>
        <span style="font-size:12.5px;color:var(--texto-suave);font-weight:600;">${this.pagina+1} / ${total}</span>
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-pag="1" ${this.pagina>=total-1?'disabled':''}>${t('seguinte')||'Seguinte'} →</button>
      </div>` : ''}`;

    window.scrollTo({top:0, behavior:'smooth'});
    this.alvo().querySelector('[data-mudar-nivel]').onclick = () => {
      try{ localStorage.removeItem('linguai:nivel'); }catch(e){}
      this.verNiveis();
    };
    this.alvo().querySelectorAll('[data-tema]').forEach(b => {
      b.onclick = () => this.gerar(b.dataset.tema, b);
    });
    this.alvo().querySelectorAll('[data-pag]').forEach(b => {
      b.onclick = () => { this.pagina += Number(b.dataset.pag); this.verTemas(); };
    });
  },

  // ── 3. Gerar (sem recarregar) ─────────────────────────
  async gerar(tema, botao){
    Espera.abrir(this.alvo(), [
      'A preparar a tua lição…',
      'A escolher as frases mais úteis…',
      'A escrever a pronúncia…',
      'Quase pronto'
    ]);

    try{
      const r = await Rede.correr('gerar_licao', {
        tema, nivel:this.nivel,
        origem:  acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino: acharIdioma(Estado.destino, IDIOMAS[1]).n
      });

      let frases = r.frases;
      if(typeof frases === 'string'){
        try{
          let s = frases.slice(frases.indexOf('['));
          const f = s.lastIndexOf(']');
          if(f > -1) s = s.slice(0, f+1);
          frases = JSON.parse(s);
        }catch(e){ frases = []; }
      }

      this.licao = {tema, explicacao:r.explicacao || '', audio:r.audio || '', frases:frases || []};
      this.fraseSel = 0; this.paginaFrase = 0;
      Historico.guardarLicao(this.licao, this.nivel);
      Espera.parar();
      this.verLicao();
      if(!this.licao.audio) this.pedirAudio();
    }catch(e){
      this.alvo().innerHTML = `
        <button class="voltar" data-voltar-temas>← ${t('escolhe_tema')}</button>
        <div class="aviso"><b>Não consegui preparar a lição.</b><br>${e.message}</div>`;
      this.alvo().querySelector('[data-voltar-temas]').onclick = () => this.verTemas();
    }
  },

  // Pede o áudio em segundo plano; a lição já está a ser lida.
  async pedirAudio(){
    const licaoNaAltura = this.licao;
    try{
      const r = await Rede.correr('gerar_audio_licao', {
        frases: JSON.stringify(licaoNaAltura.frases)
      });
      // Só aplica se a pessoa ainda estiver nesta mesma lição
      if(r && r.audio && this.licao === licaoNaAltura){
        this.licao.audio = r.audio;
        this.verLicao();
      }
    }catch(e){
      const av = document.getElementById('licAudioEspera');
      if(av) av.textContent = 'O áudio não ficou disponível desta vez.';
    }
  },

  // ── 4. A lição ────────────────────────────────────────
  verLicao(){
    const L = this.licao;
    const totalPag = Math.max(1, Math.ceil(L.frases.length / this.FRASES_POR_PAG));
    const ini = this.paginaFrase * this.FRASES_POR_PAG;
    const lote = L.frases.slice(ini, ini + this.FRASES_POR_PAG);

    this.alvo().innerHTML = `
      <button class="voltar" data-voltar-temas>← ${t('escolhe_tema')}</button>
      <h1 style="font-size:22px;margin-bottom:16px;">${L.tema}</h1>

      ${L.explicacao ? `<div class="cartao" style="background:#F3EFFB;border-color:#DCD2F2;">
        <p style="font-size:14.5px;line-height:1.65;">${L.explicacao}</p>
      </div>` : ''}

      ${!L.audio ? `<div class="lic-audio-espera">
        <span class="pontos"><i></i><i></i><i></i></span>
        <span id="licAudioEspera">A preparar o áudio das ${L.frases.length} frases…</span>
      </div>` : ''}

      ${L.audio ? `<div class="cartao-escuro" style="padding:16px 18px;margin-bottom:18px;">
        <div style="display:flex;align-items:center;gap:14px;">
          <button id="licPlay" style="width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:var(--lima);display:flex;align-items:center;justify-content:center;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="#081B44"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13px;color:#CFC7E4;">Ouvir as ${L.frases.length} frases</div>
            <div style="display:flex;align-items:center;gap:9px;margin-top:3px;">
              <div id="licTempo" style="font-size:12px;color:var(--lima);">0:00</div>
              <div class="lic-eq" id="licEq"><i></i><i></i><i></i><i></i><i></i></div>
            </div>
          </div>
          <button id="licVel" class="btn btn-calmo" style="width:auto;padding:8px 13px;font-size:12px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2);">1×</button>
        </div>
        <audio id="licAudio" preload="metadata" src="${L.audio}"></audio>
      </div>` : ''}

      <div id="licFrases">
        ${lote.map((f, i) => this.linhaFrase(f, ini + i)).join('')}
      </div>

      ${totalPag > 1 ? `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0;">
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-fpag="-1" ${this.paginaFrase===0?'disabled':''}>←</button>
        <span style="font-size:12.5px;color:var(--texto-suave);font-weight:600;">${ini+1}–${Math.min(ini+this.FRASES_POR_PAG, L.frases.length)} de ${L.frases.length}</span>
        <button class="btn btn-calmo" style="width:auto;padding:11px 16px;font-size:13px;" data-fpag="1" ${this.paginaFrase>=totalPag-1?'disabled':''}>→</button>
      </div>` : ''}

      <button class="btn" id="licPraticar" style="margin-top:8px;">Fazer os exercícios</button>
      <button class="btn btn-calmo" id="licGravar" style="margin-top:10px;">Gravar a minha voz</button>`;

    window.scrollTo({top:0, behavior:'smooth'});
    this.ligarLicao();
  },

  linhaFrase(f, idx){
    const alvo = f.alvo || f.en || '';
    const orig = f.origem || f.pt || '';
    const pron = f.pronuncia || '';
    const sel = idx === this.fraseSel;
    return `
      <div class="cartao" data-frase="${idx}" style="padding:15px 16px;margin-bottom:9px;cursor:pointer;${sel?'border-color:var(--teal);background:rgba(22,184,166,.05);':''}">
        <div style="display:flex;align-items:flex-start;gap:12px;">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:15px;">${alvo}</div>
            <div style="font-size:13px;color:var(--texto-suave);margin-top:2px;">${orig}</div>
            ${pron ? `<div style="font-size:12px;color:var(--teal);font-style:italic;margin-top:4px;">🗣 ${pron}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:7px;flex:0 0 auto;">
            <button class="ouvir-frase" data-texto="${alvo.replace(/"/g,'&quot;')}" title="Ouvir" style="width:32px;height:32px;border-radius:50%;background:rgba(22,184,166,.12);display:flex;align-items:center;justify-content:center;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--teal)"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button class="gravar-frase" data-idx="${idx}" title="Treinar pronúncia" style="width:32px;height:32px;border-radius:50%;background:rgba(245,31,71,.12);display:flex;align-items:center;justify-content:center;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--coral)">
                <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
                <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>`;
  },

  ligarLicao(){
    const raiz = this.alvo();

    raiz.querySelector('[data-voltar-temas]').onclick = () => {
      if(this.audio){ this.audio.pause(); this.audio = null; }
      this.verTemas();
    };

    raiz.querySelectorAll('[data-fpag]').forEach(b => {
      b.onclick = () => { this.paginaFrase += Number(b.dataset.fpag); this.verLicao(); };
    });

    raiz.querySelectorAll('[data-frase]').forEach(c => {
      c.onclick = e => {
        if(e.target.closest('.ouvir-frase') || e.target.closest('.gravar-frase')) return;
        this.fraseSel = Number(c.dataset.frase);
        this.verLicao();
      };
    });

    raiz.querySelectorAll('.ouvir-frase').forEach(b => {
      b.onclick = () => this.falar(b.dataset.texto, b);
    });

    raiz.querySelectorAll('.gravar-frase').forEach(b => {
      b.onclick = () => {
        const i = Number(b.dataset.idx);
        this.fraseSel = i;
        Gravacao.abrir(this.licao.frases[i], this.licao, i);
      };
    });

    const a = raiz.querySelector('#licAudio');
    if(a){
      this.audio = a;
      const play = raiz.querySelector('#licPlay');
      const tempo = raiz.querySelector('#licTempo');
      const vel = raiz.querySelector('#licVel');

      const eq = raiz.querySelector('#licEq');
      const ICO_PLAY  = '<svg width="17" height="17" viewBox="0 0 24 24" fill="#081B44"><path d="M8 5v14l11-7z"/></svg>';
      const ICO_PAUSA = '<svg width="15" height="15" viewBox="0 0 24 24" fill="#081B44"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

      // O botão e a animação seguem o áudio, não o clique
      const pintar = () => {
        const aTocar = !a.paused && !a.ended;
        play.innerHTML = aTocar ? ICO_PAUSA : ICO_PLAY;
        if(eq) eq.classList.toggle('a-tocar', aTocar);
      };
      a.onplay = a.onpause = pintar;

      play.onclick = () => { a.paused ? a.play() : a.pause(); };
      a.ontimeupdate = () => {
        const s = Math.floor(a.currentTime);
        tempo.textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
      };
      a.onended = () => {
        play.innerHTML = ICO_PLAY;
        if(eq) eq.classList.remove('a-tocar');
      };
      vel.onclick = () => {
        this.lento = !this.lento;
        a.playbackRate = this.lento ? 0.72 : 1;
        vel.textContent = this.lento ? '0.7×' : '1×';
      };
    }

    raiz.querySelector('#licPraticar').onclick = () => Exercicios.abrir(this.licao);

    const bg = raiz.querySelector('#licGravar');
    if(bg) bg.onclick = () => {
      const f = this.licao.frases[this.fraseSel];
      if(f) Gravacao.abrir(f, this.licao);
    };
  },

  // O botão que está a falar fica assinalado, para se saber qual é
  falar(texto, botao){
    if(!window.speechSynthesis) return;
    document.querySelectorAll('.a-falar').forEach(x => x.classList.remove('a-falar'));
    speechSynthesis.cancel();

    const u = new SpeechSynthesisUtterance(texto);
    const mapa = {pt:'pt-PT',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',
                  zh:'zh-CN',ja:'ja-JP',ko:'ko-KR',ar:'ar-SA',ru:'ru-RU',hi:'hi-IN',
                  nl:'nl-NL',sv:'sv-SE',tr:'tr-TR'};
    u.lang = mapa[Estado.destino] || 'en-US';
    u.rate = 0.9;

    if(botao){
      const parar = () => botao.classList.remove('a-falar');
      u.onstart = () => botao.classList.add('a-falar');
      u.onend = parar;
      u.onerror = parar;
    }
    speechSynthesis.speak(u);
  }
};

const PERG_ESCRITA = [
  'Tell me about yourself and what you do.',
  'Describe your last weekend in a few sentences.',
  'What would you do if you won a lot of money? Explain why.'
];

const Entrada = {
  origem:null, destino:null, nivel:'',
  perguntas:[], pergIdx:0, respostas:[],
  escritaIdx:0, escritas:[],

  txt(){ return TXT_ENTRADA[this.origem ? this.origem.c : 'en'] || TXT_ENTRADA.en; },
  alvo(){ return document.getElementById('v-entrada'); },

  precisa(){
    const u = Estado.utilizador;
    return !u || !u.lingua_origem_codigo || !u.lingua_destino_codigo;
  },

  abrir(){
    document.body.classList.add('em-entrada');
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
    this.alvo().classList.add('on');
    this.passoLingua('origem');
  },

  progresso(n){
    return `<div style="display:flex;gap:6px;margin-bottom:22px;">
      ${[1,2,3].map(i => `<span style="flex:1;height:4px;border-radius:2px;background:${i<=n?'var(--teal)':'var(--linha)'};"></span>`).join('')}
    </div>`;
  },

  // ── Passo 1 e 2: as línguas ───────────────────────────
  passoLingua(qual){
    const T = this.txt();
    const excluir = qual === 'destino' && this.origem ? this.origem.c : null;
    const escolhido = qual === 'origem' ? this.origem : this.destino;
    const rtl = this.origem && this.origem.c === 'ar';

    this.alvo().innerHTML = `
      <div style="direction:${rtl?'rtl':'ltr'};">
        ${this.progresso(qual === 'origem' ? 1 : 2)}
        ${qual === 'destino' ? `<button class="voltar" id="entVoltar">← ${T.voltar}</button>` : ''}
        <h1 style="font-size:23px;margin-bottom:6px;">${qual === 'origem' ? T.fala : T.aprender}</h1>
        <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">
          ${qual === 'origem' ? T.falaSub : T.aprenderSub}</p>
        <div style="display:flex;flex-wrap:wrap;gap:9px;">
          ${IDIOMAS.filter(l => l.c !== excluir).map(l => `
            <button data-cod="${l.c}" style="display:flex;align-items:center;gap:9px;padding:14px 12px;border-radius:14px;
              background:${escolhido && escolhido.c===l.c ? 'rgba(22,184,166,.1)' : 'var(--branco)'};
              border:1.5px solid ${escolhido && escolhido.c===l.c ? 'var(--teal)' : 'var(--linha)'};
              font-weight:600;font-size:13.5px;width:calc(50% - 5px);text-align:${rtl?'right':'left'};">
              <span style="font-size:19px;">${l.b}</span><span style="min-width:0;">${l.n}</span>
            </button>`).join('')}
        </div>
      </div>`;

    const v = document.getElementById('entVoltar');
    if(v) v.onclick = () => this.passoLingua('origem');

    this.alvo().querySelectorAll('[data-cod]').forEach(b => {
      b.onclick = () => {
        const l = acharIdioma(b.dataset.cod, IDIOMAS[0]);
        if(qual === 'origem'){ this.origem = l; this.passoLingua('destino'); }
        else{ this.destino = l; this.passoModo(); }
      };
    });
  },

  // ── Passo 3: como avaliar ─────────────────────────────
  passoModo(){
    const T = this.txt();
    const rtl = this.origem.c === 'ar';
    this.alvo().innerHTML = `
      <div style="direction:${rtl?'rtl':'ltr'};">
        ${this.progresso(3)}
        <button class="voltar" id="entVoltar">← ${T.voltar}</button>
        <h1 style="font-size:23px;margin-bottom:6px;">${T.nivel}</h1>
        <p style="color:var(--texto-suave);font-size:13.5px;margin-bottom:20px;">${T.nivelSub}</p>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <button id="mQuiz" class="cartao" style="text-align:${rtl?'right':'left'};margin:0;">
            <div style="font-size:26px;margin-bottom:8px;">📝</div>
            <div style="font-family:'Yusei Magic',cursive;font-size:16px;margin-bottom:4px;">${T.quiz}</div>
            <div style="font-size:12.5px;color:var(--texto-suave);line-height:1.45;">${T.quizSub}</div>
          </button>
          <button id="mEscrita" class="cartao" style="text-align:${rtl?'right':'left'};margin:0;">
            <div style="font-size:26px;margin-bottom:8px;">💬</div>
            <div style="font-family:'Yusei Magic',cursive;font-size:16px;margin-bottom:4px;">${T.escrever}</div>
            <div style="font-size:12.5px;color:var(--texto-suave);line-height:1.45;">${T.escreverSub}</div>
          </button>
        </div>

        <button id="mSaltar" style="display:block;width:100%;margin-top:16px;padding:14px;
          color:var(--texto-suave);font-weight:600;font-size:13.5px;">${T.saltar}</button>
      </div>`;

    document.getElementById('entVoltar').onclick = () => this.passoLingua('destino');
    document.getElementById('mQuiz').onclick = () => this.gerarQuiz();
    document.getElementById('mEscrita').onclick = () => this.passoEscrita();
    document.getElementById('mSaltar').onclick = () => { this.nivel = ''; this.terminar(); };
  },

  // ── Teste de escolha múltipla ─────────────────────────
  async gerarQuiz(){
    const T = this.txt();
    const b = document.getElementById('mQuiz');
    b.disabled = true;
    b.innerHTML = `<div class="carregar" style="padding:18px 0;">${T.aPreparar}
      <span class="pontos"><i></i><i></i><i></i></span></div>`;
    try{
      const r = await Rede.correr('avaliar_nivel', {
        modo:'gerar_perguntas', origem:this.origem.n, destino:this.destino.n
      });
      let p = r.perguntas;
      if(typeof p === 'string'){
        let s = p.slice(p.indexOf('['));
        const f = s.lastIndexOf(']'); if(f>-1) s = s.slice(0,f+1);
        p = JSON.parse(s);
      }
      this.perguntas = p || []; this.pergIdx = 0; this.respostas = [];
      if(!this.perguntas.length) throw new Error('sem perguntas');
      this.verPergunta();
    }catch(e){
      this.passoModo();
      this.alvo().insertAdjacentHTML('afterbegin',
        `<div class="aviso">Não consegui preparar o teste. ${e.message}</div>`);
    }
  },

  verPergunta(){
    const p = this.perguntas[this.pergIdx];
    const total = this.perguntas.length;
    this.alvo().innerHTML = `
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:20px;">
        <div style="flex:1;height:5px;background:var(--linha);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${this.pergIdx/total*100}%;background:var(--teal);transition:width .3s;"></div>
        </div>
        <span style="font-size:12px;color:var(--texto-suave);font-weight:600;">${this.pergIdx+1}/${total}</span>
      </div>
      <div class="cartao" style="padding:22px 18px;font-size:16.5px;line-height:1.5;">${p.pergunta}</div>
      <div class="escolhas">
        ${(p.opcoes||[]).map((o,i) => `<button class="escolha" data-op="${i}">${o}</button>`).join('')}
      </div>`;

    this.alvo().querySelectorAll('[data-op]').forEach(b => {
      b.onclick = () => {
        this.respostas.push({
          dificuldade:p.dificuldade || 'intermedio',
          acertou:Number(b.dataset.op) === p.correta
        });
        this.pergIdx++;
        if(this.pergIdx < total) this.verPergunta();
        else this.avaliar('avaliar_multipla', JSON.stringify(this.respostas));
      };
    });
  },

  // ── Teste por escrita ─────────────────────────────────
  passoEscrita(){
    const T = this.txt();
    const total = PERG_ESCRITA.length;
    this.alvo().innerHTML = `
      <div style="display:flex;align-items:center;gap:11px;margin-bottom:20px;">
        <div style="flex:1;height:5px;background:var(--linha);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${this.escritaIdx/total*100}%;background:var(--teal);transition:width .3s;"></div>
        </div>
        <span style="font-size:12px;color:var(--texto-suave);font-weight:600;">${this.escritaIdx+1}/${total}</span>
      </div>
      <div class="cartao" style="padding:18px;font-size:15.5px;line-height:1.5;">${PERG_ESCRITA[this.escritaIdx]}</div>
      <textarea id="entTexto" placeholder="${T.escreveAqui}" style="width:100%;min-height:120px;
        border:1.5px solid var(--linha);border-radius:14px;padding:14px;font-family:inherit;
        font-size:14.5px;resize:vertical;background:var(--branco);line-height:1.55;"></textarea>
      <button class="btn" id="entProx" style="margin-top:12px;">${T.seguinte} →</button>`;

    document.getElementById('entProx').onclick = () => {
      const t = document.getElementById('entTexto').value.trim();
      if(!t) return;
      this.escritas.push('P: ' + PERG_ESCRITA[this.escritaIdx] + '\nR: ' + t);
      this.escritaIdx++;
      if(this.escritaIdx < total) this.passoEscrita();
      else this.avaliar('avaliar_conversa', this.escritas.join('\n\n'));
    };
  },

  // ── Avaliar e mostrar ─────────────────────────────────
  async avaliar(modo, dados){
    const T = this.txt();
    this.alvo().innerHTML = `<div class="carregar" style="padding:70px 0;">
      ${T.aAvaliar}<span class="pontos"><i></i><i></i><i></i></span></div>`;
    try{
      const r = await Rede.correr('avaliar_nivel', {
        modo, origem:this.origem.n, destino:this.destino.n, respostas:dados
      });
      this.nivel = r.nivel || '';
      this.verResultado(r.feedback || '');
    }catch(e){
      this.nivel = '';
      this.terminar();
    }
  },

  verResultado(feedback){
    const T = this.txt();
    this.alvo().innerHTML = `
      <div style="text-align:center;padding:28px 6px;">
        <div style="font-size:12.5px;color:var(--texto-suave);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px;">${T.resultado}</div>
        <div style="display:inline-block;background:var(--indigo);color:#fff;border-radius:999px;
          padding:13px 32px;font-family:'Yusei Magic',cursive;font-size:21px;margin-bottom:20px;">${this.nivel}</div>
        <p style="font-size:14.5px;color:var(--texto-suave);line-height:1.65;">${feedback}</p>
      </div>
      <button class="btn" id="entFim">${T.comecar} →</button>`;
    document.getElementById('entFim').onclick = e => this.terminar(e.currentTarget);
  },

  // ── Gravar e entrar ───────────────────────────────────
  async terminar(botao){
    const T = this.txt();
    if(botao){
      botao.disabled = true;
      botao.innerHTML = `${T.aPreparar} <span class="pontos"><i></i><i></i><i></i></span>`;
    }
    Estado.origem  = this.origem.c;
    Estado.destino = this.destino.c;
    Estado.guardar();

    try{
      await Rede.correr('definir_idiomas', {
        origem_codigo:this.origem.c,  origem_nome:this.origem.n,
        destino_codigo:this.destino.c, destino_nome:this.destino.n,
        nivel:this.nivel
      });
    }catch(e){
      console.warn('[Lingu.AI] Idiomas não gravados:', e.message);
    }

    document.body.classList.remove('em-entrada');
    this.alvo().classList.remove('on');
    await Nucleo.carregarUtilizador();
    Interface.registar();
    await Nucleo.carregarTextos();
    Nucleo.pintarPar();
    Nucleo.pintarNav();
    Nucleo.pintarTextos();
    Rota.ir('inicio');
    Interface.vigiar();
    Avisos.iniciar();
  }
};

/* ── Pagamento ──────────────────────────────────────────── */
const Pagamento = {
  plano:null, fundo:null,

  abrir(plano){
    this.plano = plano;
    this.fundo = document.createElement('div');
    this.fundo.className = 'folha-fundo';
    document.body.appendChild(this.fundo);
    this.escolherMetodo();
    this.fundo.onclick = e => { if(e.target === this.fundo) this.fechar(); };
  },

  fechar(){ this.pararVigia();
    if(this.reinicio){ clearTimeout(this.reinicio); this.reinicio = null; } if(this.fundo){ this.fundo.remove(); this.fundo = null; } },

  folha(dentro){ this.fundo.innerHTML = '<div class="folha">' + dentro + '</div>'; },

  topo(titulo, sub, comVoltar){
    return `<div class="folha-topo">
      ${comVoltar ? '<button class="folha-x" id="pgVoltar" aria-label="Voltar">←</button>' : ''}
      <div style="flex:1;${comVoltar ? 'text-align:center;' : ''}">
        <div style="font-family:'Yusei Magic',cursive;font-size:16.5px;">${titulo}</div>
        ${sub ? `<div style="font-size:12.5px;color:var(--texto-suave);margin-top:2px;">${sub}</div>` : ''}
      </div>
      <button class="folha-x" id="pgX" aria-label="Fechar">✕</button>
    </div>`;
  },

  ligarTopo(voltarPara){
    const x = document.getElementById('pgX');
    if(x) x.onclick = () => this.fechar();
    const v = document.getElementById('pgVoltar');
    if(v) v.onclick = voltarPara;
  },

  escolherMetodo(){
    this.folha(
      this.topo(this.plano.nome, this.plano.preco + ' · ' + this.plano.periodo, false) +
      `<p style="font-size:13px;color:var(--texto-suave);margin-bottom:14px;">Como queres pagar?</p>
       <div style="display:flex;flex-direction:column;gap:10px;">
       ${METODOS.map(m => `
         <button class="metodo" data-metodo="${m.id}">
           <span class="metodo-ponto" style="background:${m.cor}"></span>
           <span style="flex:1;min-width:0;">
             <span style="display:block;font-weight:600;font-size:14.5px;">${m.nome}</span>
             <span style="display:block;font-size:12.5px;color:var(--texto-suave);margin-top:1px;">${m.sub}</span>
           </span>
           <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.45"><path d="m9 5 7 7-7 7"/></svg>
         </button>`).join('')}
       </div>`);

    this.ligarTopo();
    this.fundo.querySelectorAll('[data-metodo]').forEach(b => {
      b.onclick = () => {
        const m = METODOS.find(x => x.id === b.dataset.metodo);
        m.tipo === 'telefone' ? this.pedirNumero(m) : this.cartao();
      };
    });
  },

  pedirNumero(metodo){
    const nome = (Estado.utilizador && Estado.utilizador.nome) || '';
    this.folha(
      this.topo(metodo.nome, this.plano.preco, true) +
      `<div class="pg-nota-pais">Precisas de um número moçambicano. Se estás noutro país, usa o cartão.</div>
       <label class="rotulo">Número ${metodo.nome}</label>
       <input id="pgNumero" class="campo" type="tel" inputmode="numeric" maxlength="9"
              placeholder="${metodo.id === 'mpesa' ? '84XXXXXXX' : '86XXXXXXX'}">
       <label class="rotulo" style="margin-top:14px;">Nome</label>
       <input id="pgNome" class="campo" type="text" placeholder="O teu nome" value="${nome}">
       <div id="pgErro" class="pg-erro" style="display:none;"></div>
       <button class="btn" id="pgPagar" style="margin-top:18px;">Pagar ${this.plano.preco}</button>
       <p style="font-size:12px;color:var(--texto-suave);text-align:center;margin-top:12px;line-height:1.5;">
         Vais receber um pedido de confirmação no telemóvel.</p>`);

    this.ligarTopo(() => this.escolherMetodo());
    document.getElementById('pgPagar').onclick = e => this.cobrar(metodo, e.currentTarget);
  },

  async cobrar(metodo, botao){
    const numero = document.getElementById('pgNumero').value.replace(/\D/g,'');
    const nome = document.getElementById('pgNome').value.trim();
    const erro = document.getElementById('pgErro');
    const falhar = m => { erro.textContent = m; erro.style.display = 'block'; };
    erro.style.display = 'none';

    if(numero.length !== 9) return falhar('O número tem de ter 9 dígitos.');
    const validos = metodo.id === 'mpesa' ? ['84','85'] : ['86','87','88'];
    if(!validos.includes(numero.slice(0,2))){
      const lista = validos.slice(0,-1).join(', ') + ' ou ' + validos[validos.length-1];
      return falhar('Um número ' + metodo.nome + ' começa por ' + lista + '.');
    }
    if(!nome) return falhar('Escreve o teu nome.');

    botao.disabled = true;
    botao.innerHTML = 'Confirma o pagamento no teu telemóvel <span class="pontos"><i></i><i></i><i></i></span>';

    try{
      // O Bubble cobra, lê a resposta da MozPayment e ativa o plano.
      // O telemóvel só pede — nunca confirma.
      const r = await Rede.correr(metodo.id === 'mpesa' ? 'pagar_mpesa' : 'pagar_emola', {
        plano:  this.plano.id,
        numero,
        cliente: nome
      });

      if(Number(r.cod) === 200) return this.sucesso(r.transacao || '');

      botao.disabled = false;
      botao.textContent = 'Pagar ' + this.plano.preco;
      falhar(r.detalhe || r.mensagem || 'O pagamento não foi aceite.');
    }catch(e){
      botao.disabled = false;
      botao.textContent = 'Pagar ' + this.plano.preco;
      falhar('Não consegui contactar o pagamento. Verifica a ligação e tenta outra vez.');
    }
  },

  async cartao(){
    this.folha(this.topo('Cartão', this.plano.preco, true) +
      '<div class="carregar" style="padding:52px 0;">A abrir o pagamento seguro<span class="pontos"><i></i><i></i><i></i></span></div>');
    this.ligarTopo(() => this.escolherMetodo());

    try{
      const r = await Rede.correr('pagar_cartao', {
        plano:this.plano.id,
        valor:String(this.plano.valor),
        nome_cliente:(Estado.utilizador && Estado.utilizador.nome) || '',
        nome_producto:this.plano.nome
      });

      const url = r.url || r.link || r.checkout;
      if(!url) throw new Error(r.mensagem || 'não recebi o endereço de pagamento');

      this.folha(this.topo('Pagamento seguro', this.plano.preco, true) +
        `<div class="pg-caixa">
           <div class="pg-carregando" id="pgCarregando">
             <span class="pontos"><i></i><i></i><i></i></span>
             <span>A abrir a página do banco…</span>
           </div>
           <iframe id="pgFrame" src="${url}" class="pg-quadro" title="Pagamento"
                   allow="payment" loading="eager" style="opacity:0;"></iframe>
         </div>
         <div class="pg-nota" id="pgNota">Preenche os dados do cartão acima para concluir.</div>`);

      this.ligarTopo(() => { this.pararVigia(); this.escolherMetodo(); });

      const frame = document.getElementById('pgFrame');
      frame.onload = () => {
        const aviso = document.getElementById('pgCarregando');
        if(aviso) aviso.remove();
        frame.style.opacity = '1';
      };
      // Rede lenta: mostra assim mesmo ao fim de 6 segundos
      setTimeout(() => {
        const aviso = document.getElementById('pgCarregando');
        if(aviso){ aviso.remove(); frame.style.opacity = '1'; }
      }, 6000);

      // Depois de algum tempo, a mensagem passa a explicar a espera
      setTimeout(() => {
        const n = document.getElementById('pgNota');
        if(n) n.textContent = 'Assim que o banco confirmar, libertamos o teu plano.';
      }, 20000);

      this.vigiar();

    }catch(e){
      this.folha(this.topo('Cartão', this.plano.preco, true) +
        '<div class="pg-erro" style="display:block;">Não consegui abrir o pagamento. ' + e.message + '</div>');
      this.ligarTopo(() => this.escolherMetodo());
    }
  },

  // Vai perguntando ao Bubble se o pagamento já entrou
  vigiar(){
    this.pararVigia();
    let tentativas = 0;
    this.vigia = setInterval(async () => {
      tentativas++;
      if(tentativas > 60){ this.pararVigia(); return; }   // desiste ao fim de ~3 min
      try{
        const r = await Rede.correr('estado_pagamento', {plano:this.plano.id});
        if(r && (r.estado === 'completed' || r.estado === 'pago')){
          this.pararVigia();
          this.sucesso(r.transacao || '');
        }
      }catch(err){}
    }, 3000);
  },

  pararVigia(){ if(this.vigia){ clearInterval(this.vigia); this.vigia = null; } },


  sucesso(transacao){
    this.folha(`
      <div style="text-align:center;padding:26px 6px 10px;">
        <div style="width:62px;height:62px;margin:0 auto 18px;border-radius:50%;background:rgba(22,184,166,.12);display:flex;align-items:center;justify-content:center;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg>
        </div>
        <div style="font-family:'Yusei Magic',cursive;font-size:19px;margin-bottom:8px;">Pagamento recebido</div>
        <p style="font-size:13.5px;color:var(--texto-suave);line-height:1.6;">O ${this.plano.nome} já está ativo.
          ${transacao ? '<br><span style="font-size:12px;">Ref. ' + transacao + '</span>' : ''}</p>
      </div>
      <button class="btn" id="pgFim" style="margin-top:14px;">Continuar a aprender</button>`);

    // A confirmação já chegou: recarregar a app para tudo aparecer atualizado
    const recarregar = () => { try{ location.reload(); }catch(e){} };
    this.reinicio = setTimeout(recarregar, 4000);
    document.getElementById('pgFim').onclick = recarregar;
  }
};

/* ══════════════════════════════════════════════════════════
   MÓDULO: ASSISTENTE
   ══════════════════════════════════════════════════════════ */
const SUGESTOES = [
  {r:'Regra de gramática',    m:'Explica-me uma regra de gramática'},
  {r:'Diferença de palavras', m:'Qual a diferença entre estas duas palavras?'},
  {r:'Como pronunciar',       m:'Como pronuncio esta palavra?'}
];

const Assistente = {
  historico:[], aEsperar:false,

  pintar(){
    document.getElementById('assistenteConteudo').innerHTML = `
      <div id="asstFio">${this.historico.length ? '' : this.boasVindas()}</div>
      <div class="asst-barra">
        <button id="asstMic" aria-label="Falar">
          <svg viewBox="0 0 24 24" fill="var(--teal)">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/>
            <path d="M18 11a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11z"/>
          </svg>
        </button>
        <textarea id="asstTexto" rows="1" placeholder="Escreve a tua dúvida..."></textarea>
        <button id="asstEnviar" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="#fff"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="asst-dica" id="asstDica"></div>`;

    if(this.historico.length) this.repintarFio(); else this.ligarSugestoes();

    const caixa = document.getElementById('asstTexto');
    caixa.oninput = () => {
      caixa.style.height = 'auto';
      caixa.style.height = Math.min(caixa.scrollHeight, 110) + 'px';
    };
    caixa.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); this.enviar(); } };
    document.getElementById('asstEnviar').onclick = () => this.enviar();
    document.getElementById('asstMic').onclick = () => this.microfone();
  },

  boasVindas(){
    return `<div class="asst-vazio">
      <div class="t">Olá! 👋</div>
      <p>Pergunta-me o que quiseres — posso explicar, dar exemplos, e até propor um exercício.</p>
      <div class="asst-sugs">
        ${SUGESTOES.map(s => `<button class="asst-sug" data-sug="${s.m}">${s.r}</button>`).join('')}
      </div></div>`;
  },

  ligarSugestoes(){
    document.querySelectorAll('[data-sug]').forEach(b => {
      b.onclick = () => { document.getElementById('asstTexto').value = b.dataset.sug; this.enviar(); };
    });
  },

  repintarFio(){
    const fio = document.getElementById('asstFio');
    fio.innerHTML = this.historico.map(h => `
      <div class="asst-linha ${h.de === 'eu' ? 'eu' : 'ia'}">
        <div class="asst-bolha">${h.texto}</div>
        ${h.de === 'ia' ? `<button class="asst-ouvir" data-falar="${h.texto.replace(/"/g,'&quot;').slice(0,400)}">
          <svg viewBox="0 0 24 24" fill="var(--teal)" width="10" height="10"><path d="M8 5v14l11-7z"/></svg> Ouvir</button>` : ''}
      </div>`).join('') + (this.aEsperar ?
      '<div class="asst-linha ia"><div class="asst-bolha"><span class="pontos"><i></i><i></i><i></i></span></div></div>' : '');

    fio.querySelectorAll('[data-falar]').forEach(b => b.onclick = () => this.falar(b.dataset.falar, b));
    fio.scrollTop = fio.scrollHeight;
  },

  gravador:null, fluxo:null, aGravar:false,

  // Ditar em vez de escrever
  async microfone(){
    const b = document.getElementById('asstMic');
    const dica = document.getElementById('asstDica');
    const dizer = m => { if(dica) dica.textContent = m || ''; };

    if(this.aGravar){
      if(this.gravador && this.gravador.state !== 'inactive') this.gravador.stop();
      if(this.fluxo) this.fluxo.getTracks().forEach(t => t.stop());
      this.aGravar = false;
      b.classList.remove('a-gravar');
      dizer('A transcrever…');
      return;
    }

    try{ this.fluxo = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch(e){ dizer('Sem acesso ao microfone.'); return; }

    const pedacos = [];
    this.gravador = new MediaRecorder(this.fluxo);
    this.gravador.ondataavailable = ev => { if(ev.data.size) pedacos.push(ev.data); };
    this.gravador.onstop = async () => {
      try{
        const blob = new Blob(pedacos, {type:'audio/webm'});
        const base64 = await new Promise((ok, falha) => {
          const l = new FileReader();
          l.onload = () => ok(String(l.result).split(',')[1]);
          l.onerror = () => falha(new Error('erro'));
          l.readAsDataURL(blob);
        });
        const r = await Rede.correr('transcrever', {audio_base64:base64});
        const txt = (r && r.texto || '').trim();
        dizer('');
        if(!txt) return;
        const caixa = document.getElementById('asstTexto');
        caixa.value = (caixa.value ? caixa.value + ' ' : '') + txt;
        caixa.focus();
        caixa.dispatchEvent(new Event('input'));
      }catch(e){ dizer('Não consegui transcrever.'); }
    };
    this.gravador.start();
    this.aGravar = true;
    b.classList.add('a-gravar');
    dizer('A ouvir… toca para parar');
  },

  async enviar(){
    const caixa = document.getElementById('asstTexto');
    const texto = caixa.value.trim();
    if(!texto || this.aEsperar) return;

    this.historico.push({de:'eu', texto});
    caixa.value = ''; caixa.style.height = 'auto';
    this.aEsperar = true;
    this.repintarFio();

    try{
      const r = await Rede.correr('assistente', {
        mensagem:texto,
        historico:JSON.stringify(this.historico.slice(0,-1)),
        origem: acharIdioma(Estado.origem, IDIOMAS[0]).n,
        destino:acharIdioma(Estado.destino, IDIOMAS[1]).n
      });
      this.aEsperar = false;
      this.historico.push({de:'ia', texto:(r.resposta || '').trim() || 'Não consegui responder agora.'});
    }catch(e){
      this.aEsperar = false;
      this.historico.push({de:'ia', texto:'Não consegui responder agora. Tenta outra vez, por favor. 🙏'});
    }
    this.repintarFio();
  },

  falar(texto, botao){
    if(!window.speechSynthesis) return;
    document.querySelectorAll('.a-falar').forEach(x => x.classList.remove('a-falar'));
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    const mapa = {pt:'pt-PT',en:'en-US',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',
                  zh:'zh-CN',ja:'ja-JP',ko:'ko-KR',ar:'ar-SA',ru:'ru-RU',hi:'hi-IN',
                  nl:'nl-NL',sv:'sv-SE',tr:'tr-TR'};
    u.lang = mapa[Estado.origem] || 'pt-PT';
    if(botao){
      const parar = () => botao.classList.remove('a-falar');
      u.onstart = () => botao.classList.add('a-falar');
      u.onend = parar; u.onerror = parar;
    }
    speechSynthesis.speak(u);
  }
};



/* ══════════════════════════════════════════════════════════
   AVISOS — lembretes no telemóvel (OneSignal)
   ══════════════════════════════════════════════════════════ */
const Avisos = {
  pronto:false,

  disponivel(){ return typeof Notification !== 'undefined' && !!CFG.onesignal; },
  concedida(){ return this.disponivel() && Notification.permission === 'granted'; },

  // A autorização do browser não chega: é preciso o OneSignal ter registado o aparelho
  inscrito(){
    try{ return !!(window.OneSignal && OneSignal.User && OneSignal.User.PushSubscription.id); }
    catch(e){ return false; }
  },
  recusada(){ return this.disponivel() && Notification.permission === 'denied'; },
  porPerguntar(){ return this.disponivel() && Notification.permission === 'default'; },

  iniciar(){
    if(!this.disponivel() || window.OneSignalDeferred) return;
    window.OneSignalDeferred = [];
    const s = document.createElement('script');
    s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
    s.defer = true;
    document.head.appendChild(s);

    window.OneSignalDeferred.push(async OneSignal => {
      try{
        await OneSignal.init({
          appId: CFG.onesignal,
          serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
          serviceWorkerParam: {scope: '/push/onesignal/'}
        });
        this.pronto = true;
        await this.identificar();
        // O cartão foi desenhado antes disto: refrescar se estiver à vista
        if(Estado.vista === 'inicio' || Estado.vista === 'perfil') Rota.ir(Estado.vista);
      }catch(e){ console.warn('[Lingu.AI] Avisos:', e.message); }
    });
  },

  // Liga este telemóvel à conta, para o Bubble saber a quem enviar
  async identificar(){
    const id = Estado.utilizador && Estado.utilizador.id;
    if(!id || !window.OneSignal) return;
    try{ await window.OneSignal.login(String(id)); }catch(e){}
  },

  async pedir(){
    if(!window.OneSignal) return false;
    try{ await window.OneSignal.Notifications.requestPermission(); }catch(e){}
    if(!this.concedida()) return false;
    try{ await window.OneSignal.User.PushSubscription.optIn(); }catch(e){}
    await this.identificar();
    return this.inscrito();
  },

  // Cartão do Perfil
  cartao(){
    if(!this.disponivel()) return '';
    if(this.concedida() && !this.inscrito()){
      return `<div class="cartao av-cartao">
        <div class="av-t">🔔 Quase lá</div>
        <p class="av-d">Autorizaste as notificações, mas o registo ainda não terminou.</p>
        <button class="btn" id="avLigar" style="margin-top:14px;">Terminar registo</button>
      </div>`;
    }
    if(this.concedida()){
      return `<div class="cartao av-cartao av-on">
        <div class="av-t">🔔 Lembretes ligados</div>
        <p class="av-d">Avisamos-te antes de perderes a sequência, e quando faltar pouco para a tua meta.</p>
      </div>`;
    }
    if(this.recusada()){
      return `<div class="cartao av-cartao">
        <div class="av-t">🔕 Lembretes desligados</div>
        <p class="av-d">Bloqueaste as notificações neste browser. Para as voltar a ligar, muda nas definições do site.</p>
      </div>`;
    }
    return `<div class="cartao av-cartao">
      <div class="av-t">🔔 Queres que te lembremos?</div>
      <p class="av-d">Avisamos-te antes de perderes a sequência de dias, e quando faltar pouco para a meta.</p>
      <button class="btn" id="avLigar" style="margin-top:14px;">Ligar lembretes</button>
    </div>`;
  },

  ligarCartao(){
    const b = document.getElementById('avLigar');
    if(!b) return;
    b.onclick = async () => {
      b.disabled = true;
      await this.pedir();
      // O registo fecha um instante depois: esperar por ele, até 6 segundos
      for(let i = 0; i < 12 && !this.inscrito(); i++){
        await new Promise(r => setTimeout(r, 500));
      }
      Rota.ir(Estado.vista === 'perfil' ? 'perfil' : 'inicio');
    };
  },

  // Convite discreto, depois de uma sequência começar
  convidar(){
    if(!this.porPerguntar() || Jogo.e.sequencia < 1) return;
    try{ if(localStorage.getItem('linguai:semAvisos') === 'sim') return; }catch(e){}

    const f = document.createElement('div');
    f.className = 'folha-fundo';
    f.innerHTML = `<div class="folha" style="text-align:center;padding-top:28px;">
      <div style="font-size:46px;margin-bottom:14px;">🔥</div>
      <div style="font-family:'Yusei Magic',cursive;font-size:19px;margin-bottom:8px;">${Jogo.e.sequencia} ${Jogo.e.sequencia === 1 ? 'dia' : 'dias'} seguidos</div>
      <p style="font-size:13.5px;color:var(--texto-suave);line-height:1.6;margin-bottom:22px;">
        Queres que te avisemos antes de a perderes?</p>
      <button class="btn" id="avSim">Sim, avisa-me</button>
      <button class="lg-link" id="avNao">Agora não</button>
    </div>`;
    document.body.appendChild(f);

    f.querySelector('#avSim').onclick = async () => { f.remove(); await this.pedir(); };
    f.querySelector('#avNao').onclick = () => {
      f.remove();
      try{ localStorage.setItem('linguai:semAvisos', 'sim'); }catch(e){}
    };
  }
};





/* ══════════════════════════════════════════════════════════
   SESSÃO ÚNICA — uma conta, um telemóvel de cada vez
   Quem entra de novo fica com a conta; o anterior é avisado.
   ══════════════════════════════════════════════════════════ */
const Sessao = {
  guardar(s){ try{ s ? localStorage.setItem('linguai:sessao', s) : localStorage.removeItem('linguai:sessao'); }catch(e){} },
  minha(){ try{ return localStorage.getItem('linguai:sessao') || ''; }catch(e){ return ''; } },

  // Chamado sempre que falamos com o Bubble
  verificar(doServidor){
    if(!doServidor) return true;               // o Bubble ainda não tem sessão única
    const minha = this.minha();
    if(!minha){ this.guardar(doServidor); return true; }
    if(minha === doServidor) return true;
    this.expulsar();
    return false;
  },

  expulsar(){
    if(this.jaExpulso) return;
    this.jaExpulso = true;
    Rede.guardarToken('');
    this.guardar('');
    try{ localStorage.removeItem('linguai:estado'); }catch(e){}
    Estado.utilizador = null;

    document.body.classList.add('em-login');
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('on'));
    const alvo = document.getElementById('v-login');
    alvo.classList.add('on');
    alvo.innerHTML = `

        <div class="lg-nome" style="font-size:20px;">Sessão aberta noutro aparelho</div>

      </div>
      <button class="btn" id="sesEntrar" style="margin-top:22px;">Entrar aqui outra vez</button>`;
